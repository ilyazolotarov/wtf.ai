plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.wtf'
version = '1.0.0'

android {
  namespace "ai.wtf.sensorcapture"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // JsKeepAlive: React Native's headless JS tasks (the version is the app's, as for expo-asset).
  implementation 'com.facebook.react:react-android'
}
