plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.wtf'
version = '1.0.0'

android {
  namespace "ai.wtf.vehiclelink"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // The wake runs a headless JS task (WakeService.kt).
  implementation 'com.facebook.react:react-android'
}
