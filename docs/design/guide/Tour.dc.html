<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map tour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4371B7}a:hover{color:#2F5A99}
button{font-family:inherit}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2EFE9; color: #1D1C1A; font-family: 'Onest', sans-serif">
  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <rect width="390" height="844" fill="#F2EFE9"></rect>
    <path d="M-20 760 C 70 720 150 790 250 750 S 380 700 420 720 V 870 H -20 Z" fill="#BFD9EC"></path>
    <rect x="208" y="268" width="80" height="188" rx="6" fill="#D5E8C8"></rect>
    <rect x="12" y="60" width="64" height="70" rx="3" fill="#E6E1D8"></rect>
    <rect x="12" y="150" width="64" height="86" rx="3" fill="#E6E1D8"></rect>
    <rect x="104" y="60" width="78" height="176" rx="3" fill="#E6E1D8"></rect>
    <rect x="210" y="60" width="76" height="80" rx="3" fill="#E6E1D8"></rect>
    <rect x="314" y="60" width="66" height="176" rx="3" fill="#E6E1D8"></rect>
    <rect x="12" y="266" width="64" height="190" rx="3" fill="#E6E1D8"></rect>
    <rect x="104" y="266" width="78" height="80" rx="3" fill="#E6E1D8"></rect>
    <rect x="314" y="266" width="66" height="96" rx="3" fill="#E6E1D8"></rect>
    <rect x="12" y="486" width="64" height="200" rx="3" fill="#E6E1D8"></rect>
    <rect x="104" y="486" width="78" height="120" rx="3" fill="#E6E1D8"></rect>
    <rect x="210" y="486" width="76" height="70" rx="3" fill="#E6E1D8"></rect>
    <rect x="314" y="486" width="66" height="120" rx="3" fill="#E6E1D8"></rect>
    <g fill="none" stroke-linecap="round">
      <path d="M-20 250 H410 M-20 470 H410 M90 -20 V740 M300 -20 V720" stroke="#DCD5C8" stroke-width="13"></path>
      <path d="M-20 250 H410 M-20 470 H410 M90 -20 V740 M300 -20 V720" stroke="#FFFFFF" stroke-width="10"></path>
      <path d="M195 -20 V740 M-20 680 C 120 640 260 600 410 560" stroke="#E3C77E" stroke-width="17"></path>
      <path d="M195 -20 V740 M-20 680 C 120 640 260 600 410 560" stroke="#F8DFA0" stroke-width="13"></path>
    </g>
    <circle cx="195" cy="540" r="36" fill="rgba(67,113,183,0.14)" stroke="rgba(67,113,183,0.45)" stroke-width="1.5"></circle>
    <path d="M195 540 L178 500 A 44 44 0 0 1 212 500 Z" fill="rgba(67,113,183,0.28)"></path>
    <circle cx="195" cy="540" r="9" fill="#4371B7" stroke="#FFFFFF" stroke-width="3"></circle>
  </svg>

  <div style="position: absolute; left: 16px; top: 58px; width: 230px; height: 52px; box-sizing: border-box; border-radius: 999px; background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(40,30,10,0.14); display: flex; align-items: center; gap: 10px; padding: 0 14px 0 10px">
    <div style="width: 30px; height: 30px; border-radius: 15px; background: #3D865A2E; display: flex; align-items: center; justify-content: center"><div style="width: 10px; height: 10px; border-radius: 5px; background: #3D865A"></div></div>
    <div style="flex: 1; display: flex; flex-direction: column">
      <div style="font-size: 15px; font-weight: 600">Position trusted</div>
      <div style="font-size: 12px; color: #6B675F">GNSS · <span style="color: #3D865A">±5 m</span></div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B675F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10l4 4 4-4"></path></svg>
  </div>
  <div style="position: absolute; right: 16px; top: 56px; width: 60px; height: 60px; border-radius: 30px; background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(40,30,10,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center">
    <div style="font-size: 26px; font-weight: 300; line-height: 28px">42</div>
    <div style="font-size: 10px; color: #6B675F">km/h</div>
  </div>

  <sc-if value="{{ showPin }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 250px; top: 300px; width: 80px; height: 80px">
      <div style="position: absolute; inset: 0; border-radius: 40px; border: 3px solid #4371B7; animation: ring 1.4s ease-out infinite"></div>
      <svg width="40" height="40" viewBox="0 0 24 24" style="position: absolute; left: 20px; top: 2px" aria-hidden="true"><path d="M12 22s-7-6.2-7-12a7 7 0 1 1 14 0c0 5.8-7 12-7 12z" fill="#4371B7"></path><circle cx="12" cy="10" r="2.6" fill="#FFFFFF"></circle></svg>
    </div>
  </sc-if>

  <button type="button" aria-label="Camera: follow" style="position: absolute; right: 16px; top: 668px; width: 56px; height: 56px; border: 0; border-radius: 28px; background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(40,30,10,0.14); display: flex; align-items: center; justify-content: center">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4371B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"></circle><circle cx="12" cy="12" r="2" fill="#4371B7"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"></path></svg>
  </button>

  <div style="position: absolute; left: 16px; right: 16px; top: 746px; height: 74px; border-radius: 24px; background: rgba(255,255,255,0.82); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(40,30,10,0.14); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1C1A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"></path></svg>
      <div style="font-size: 12px; font-weight: 500">Route</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <div style="position: relative; width: 24px; height: 24px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1C1A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 14.5l1.7-5a2 2 0 0 1 1.9-1.4h7.8a2 2 0 0 1 1.9 1.4l1.7 5"></path><rect x="3" y="14.5" width="18" height="4.5" rx="1.6"></rect></svg>
        <div style="position: absolute; right: -5px; top: -3px; width: 11px; height: 11px; border-radius: 6px; background: #3D865A; border: 2px solid #FFFFFF"></div>
      </div>
      <div style="font-size: 12px; font-weight: 500">Vehicle</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#1D1C1A" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="18.5" cy="12" r="1.8"></circle></svg>
      <div style="font-size: 12px; font-weight: 500">More</div>
    </div>
  </div>

  <sc-if value="{{ isInvite }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 16px; right: 16px; top: 568px; box-sizing: border-box; border-radius: 24px; background: rgba(255,255,255,0.9); backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(40,30,10,0.14); padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <div style="width: 40px; height: 40px; border-radius: 20px; background: #4371B729; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4371B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 15px; font-weight: 600">New here? A one-minute tour</div>
          <div style="font-size: 13px; color: #6B675F">Six things on this screen worth knowing.</div>
        </div>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" onClick="{{ dismiss }}" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: #EDEBE6; color: #6B675F; font-size: 14px; font-weight: 600; cursor: pointer">Not now</button>
        <button type="button" onClick="{{ start }}" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: #4371B7; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Show me</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isTouring }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: {{ spot.left }}px; top: {{ spot.top }}px; width: {{ spot.width }}px; height: {{ spot.height }}px; border-radius: {{ spot.radius }}px; box-shadow: 0 0 0 1600px rgba(14,13,12,0.62); border: 2px solid #FFFFFF; box-sizing: border-box; pointer-events: none; transition: all 300ms ease"></div>
    <div style="position: absolute; left: 16px; right: 16px; {{ spot.card }}; box-sizing: border-box; border-radius: 24px; background: #FFFFFF; box-shadow: 0 12px 40px rgba(0,0,0,0.25); padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="font-size: 12px; font-weight: 600; color: #4371B7; letter-spacing: 0.4px">{{ stepLabel }}</div>
        <button type="button" onClick="{{ dismiss }}" style="border: 0; background: none; padding: 6px 2px; color: #6B675F; font-size: 13px; font-weight: 500; cursor: pointer">Skip tour</button>
      </div>
      <div style="font-size: 18px; font-weight: 600; line-height: 23px">{{ spot.title }}</div>
      <div style="font-size: 14px; line-height: 20px; color: #4A4741">{{ spot.body }}</div>
      <div style="display: flex; gap: 8px; margin-top: 6px">
        <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ back }}" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: #EDEBE6; color: #1D1C1A; font-size: 14px; font-weight: 600; cursor: pointer">Back</button>
        </sc-if>
        <button type="button" onClick="{{ next }}" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: #4371B7; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">{{ nextLabel }}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 16px; right: 16px; top: 600px; box-sizing: border-box; border-radius: 999px; background: rgba(29,28,26,0.92); color: #F2F0EC; padding: 12px 12px 12px 18px; display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; font-size: 13px; line-height: 18px">Tour done. It’s in More › How to use wtf.ai.</div>
      <a href="More.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #90BAF1; color: #0E1220; font-size: 13px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Open</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  renderVals() {
    const STOPS = [
      { left: 10, top: 52, width: 242, height: 64, radius: 32, card: 'top: 132px',
        title: 'Can GPS be trusted?',
        body: 'Green when the phone’s GPS agrees with the car. When it is jammed or spoofed this says so, and what the dot follows instead. Tap it for details.' },
      { left: 125, top: 470, width: 140, height: 140, radius: 70, card: 'top: 160px',
        title: 'The car is in the circle',
        body: 'Without GPS the dot keeps moving on the car’s wheel speed and the phone’s turns, and stays on the roads. A bigger circle means less sure.' },
      { left: 244, top: 294, width: 92, height: 92, radius: 46, card: 'top: 404px',
        title: 'Press and hold the map',
        body: 'Drops a pin: Route here. While the car stands, “I’m here” puts the car on the map when the dot is wrong.' },
      { left: 308, top: 662, width: 68, height: 68, radius: 34, card: 'top: 404px',
        title: 'Follow the car',
        body: 'Tap to switch between following, heading up and a free map. Moving the map lets go of the car; tap to come back.' },
      { left: 141, top: 742, width: 108, height: 82, radius: 22, card: 'top: 470px',
        title: 'Your car’s connection',
        body: 'Its dot: green, the car is connected; yellow, connecting; red, no adapter found. While you drive it reads “Driving”.' },
      { left: 260, top: 742, width: 108, height: 82, radius: 22, card: 'top: 470px',
        title: 'This guide, maps and settings',
        body: 'Come back to these lessons any time: More › How to use wtf.ai. Offline maps and Settings are there too.' },
    ];
    const step = this.state.step;
    const last = STOPS.length;
    const spot = STOPS[Math.min(Math.max(step - 1, 0), last - 1)];
    return {
      isInvite: step === 0,
      isTouring: step >= 1 && step <= last,
      isDone: step > last,
      showPin: step === 3,
      spot,
      stepLabel: step + ' OF ' + last,
      canBack: step > 1,
      nextLabel: step === last ? 'Done' : 'Next',
      start: () => this.setState({ step: 1 }),
      next: () => this.setState({ step: step + 1 }),
      back: () => this.setState({ step: step - 1 }),
      dismiss: () => this.setState({ step: last + 1 }),
    };
  }
}
</script>
</body>
</html>
