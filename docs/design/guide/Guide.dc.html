<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How to use wtf.ai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4371B7}a:hover{color:#2F5A99}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4F1; color: #1D1C1A; font-family: 'Onest', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; justify-content: center; padding-top: 8px"><div style="width: 38px; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.18)"></div></div>
  <div style="display: flex; align-items: center; gap: 4px; padding: 14px 12px 0">
    <a href="More.dc.html" aria-label="Back to More" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4371B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.5px">How to use wtf.ai</div>
  </div>
  <div style="padding: 2px 16px 0 60px; font-size: 13px; color: #6B675F">3 of 9 lessons done</div>

  <div style="flex: 1; overflow-y: auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 20px">
    <a href="Tour.dc.html" style="text-decoration: none; color: #FFFFFF; background: #4371B7; border-radius: 24px; padding: 18px; display: flex; align-items: center; gap: 14px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #DCE7F7">ON THE MAP · 1 MIN</div>
        <div style="font-size: 18px; font-weight: 600">Take the map tour</div>
        <div style="font-size: 13px; line-height: 18px; color: #E8EFFA">Six stops on the real map: what each button and badge means.</div>
      </div>
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#4371B7" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
      </div>
    </a>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; font-weight: 500; color: #6B675F; padding-left: 4px">{{ g.title }}</div>
        <div style="background: #FFFFFF; border-radius: 24px; padding: 2px 14px">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
            <a href="{{ it.href }}" style="text-decoration: none; color: #1D1C1A; min-height: 64px; display: flex; align-items: center; gap: 12px; border-top: {{ it.divider }}">
              <div style="width: 30px; height: 30px; border-radius: 15px; background: {{ it.badgeBg }}; color: {{ it.badgeFg }}; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <sc-if value="{{ it.done }}" hint-placeholder-val="{{ false }}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Done" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                </sc-if>
                <sc-if value="{{ it.todo }}" hint-placeholder-val="{{ true }}">{{ it.n }}</sc-if>
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 10px 0">
                <div style="font-size: 15px; font-weight: 500">{{ it.title }}</div>
                <div style="font-size: 13px; color: #6B675F">{{ it.sub }}</div>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B675F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <a href="Main.dc.html" style="align-self: center; font-size: 14px; font-weight: 500; padding: 10px 14px; text-decoration: none">Show the first-run screens again</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const GROUPS = [
      ['Getting started', [
        ['Before you drive', 'Holder, adapter, map', true, 'LessonBefore.dc.html'],
        ['What the dot is telling you', 'GPS status and the circle', true, 'LessonStatus.dc.html'],
        ['The car button', 'Connecting the adapter', true, 'LessonCar.dc.html'],
      ]],
      ['When GPS fails', [
        ['Driving through jamming', 'What the app does on its own', false, 'LessonJamming.dc.html'],
        ['Put the car on the map', 'When the dot is in the wrong place', false, 'LessonPlace.dc.html'],
        ['“Is the car where the dot is?”', 'The question when you set off', false, 'LessonPose.dc.html'],
      ]],
      ['Routes', [
        ['Plan a route', 'Press and hold, or search', false, 'LessonRoute.dc.html'],
        ['Spoken directions', 'Mute, volume, phone or car speakers', false, 'LessonVoice.dc.html'],
      ]],
      ['Maps', [
        ['Offline maps', 'Download, switch and update regions', false, 'LessonMaps.dc.html'],
      ]],
    ];
    let n = 0;
    return {
      groups: GROUPS.map(([title, items]) => ({
        title,
        items: items.map(([t, sub, done, href], i) => {
          n += 1;
          return {
            n, title: t, sub, done, todo: !done, href,
            badgeBg: done ? '#3D865A' : '#EDEBE6',
            badgeFg: done ? '#FFFFFF' : '#6B675F',
            divider: i === 0 ? 'none' : '1px solid rgba(0,0,0,0.07)',
          };
        }),
      })),
    };
  }
}
</script>
</body>
</html>
