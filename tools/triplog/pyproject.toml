[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wtf-triplog"
version = "0.1.0"
description = "Reader and analysis tools for wtf.ai ULog trip logs"
requires-python = ">=3.11"
dependencies = ["pyulog>=1.0", "numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
triplog = "triplog.cli:main"

[tool.setuptools]
packages = ["triplog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
