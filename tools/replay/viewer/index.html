<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drive Replay</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --text2: #5b6270; --line: #e3e6eb;
    --gps: #16a34a; --phone: #7c3aed; --pred: #2563eb; --cmp: #ea580c;
    --coarse: #d97706; --rej: #dc2626; --cut: #8b93a1; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --road: #a21caf; --road-end: #ea580c; --truth: #0f766e; --mm: #111827; --accent: #2563eb;
    --nogps: #8b93a1; --appcut: #d97706; --replaycut: #2563eb; --route: #db2777;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #e8eaee; --text2: #9aa2b1; --line: #2a2f3a;
      --gps: #4ade80; --phone: #c4b5fd; --pred: #60a5fa; --cmp: #fb923c;
      --coarse: #fbbf24; --rej: #f87171; --cut: #8b93a1; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --road: #e879f9; --road-end: #fb923c; --truth: #2dd4bf; --mm: #fde047; --accent: #60a5fa;
      --nogps: #8b93a1; --appcut: #fbbf24; --replaycut: #60a5fa; --route: #f472b6;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; }
  header, .controls { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .controls { border-top: 1px solid var(--line); border-bottom: none; }
  header h1 { font-size: 14px; margin: 0 6px 0 0; }
  select, input, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
  label { color: var(--text2); display: flex; gap: 5px; align-items: center; }
  #file { max-width: 300px; }
  #status { color: var(--text2); margin-left: auto; }
  details.more { position: relative; }
  details.more > summary { cursor: pointer; color: var(--text2); list-style: none; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; }
  details.more > div { position: absolute; z-index: 5; top: 32px; right: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; display: grid; gap: 8px; min-width: 260px; box-shadow: 0 6px 24px #0003; }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  .mapwrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  details.layers { position: absolute; top: 10px; left: 10px; z-index: 2; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; }
  details.layers > summary { cursor: pointer; font-weight: 600; }
  details.layers label { padding: 2px 0; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); margin: 16px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .facts { color: var(--text2); }
  .facts b { color: var(--text); font-weight: 600; }
  .drive-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .tracks label { color: var(--text); padding: 1px 0; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .outage { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; }
  .outage:hover { border-color: var(--accent); }
  .outage.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .outage .head { display: flex; gap: 6px; align-items: baseline; }
  .outage .kind { font-weight: 600; }
  .outage .when { margin-left: auto; color: var(--text2); font-variant-numeric: tabular-nums; }
  .outage .row { display: grid; grid-template-columns: 14px 1fr; gap: 6px; align-items: center; margin-top: 3px; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .good { color: var(--ok); } .meh { color: var(--warn); } .poor { color: var(--bad); }
  .muted { color: var(--text2); }
  .now-row { display: grid; grid-template-columns: 14px 1fr; gap: 6px; align-items: center; padding: 2px 0; }
  .big { font-size: 15px; }
  details.box { margin-top: 14px; }
  details.box > summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); }
  #events { list-style: none; margin: 6px 0 0; padding: 0; }
  #events li { padding: 2px 0; cursor: pointer; display: grid; grid-template-columns: 52px 1fr; gap: 6px; color: var(--text2); }
  #events li.past { color: var(--text); }
  #events li.marker { font-weight: 600; }
  #events li span:first-child { font-variant-numeric: tabular-nums; text-align: right; }
  #summary { white-space: pre-wrap; font-size: 12px; color: var(--text2); margin-top: 6px; }
  #timeline { width: 100%; height: 174px; display: block; background: var(--panel); cursor: crosshair; touch-action: none;
    border-top: 1px solid var(--line); }
  #time { font-variant-numeric: tabular-nums; min-width: 190px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Drive replay</h1>
  <select id="file" aria-label="Drive"></select>
  <label title="The navigator the replay runs. Open loop = what the app runs now; the others close the loop from map matching (MAPMATCH-SPEC §9)">Navigator
    <select id="loop">
      <option value="">As on the phone</option>
      <option value="open">Open loop</option>
      <option value="heading">Road heading</option>
      <option value="closed">Full correction</option>
    </select></label>
  <label title="What the replay gets of GPS. As in the app = your Cut GPS moments withheld, like on the phone">GPS
    <select id="gps">
      <option value="app">As in the app</option>
      <option value="all">All of it</option>
      <option value="cut">Cut at…</option>
      <option value="jam">Jammed (Wi-Fi/cell only)</option>
      <option value="nogps">None after the start</option>
    </select></label>
  <input id="cut" placeholder="start:length s, e.g. 120:240" size="20" hidden />
  <label title="Run a second navigator version and draw it in orange">Compare
    <select id="compare">
      <option value="">—</option>
      <option value="open">Open loop</option>
      <option value="heading">Road heading</option>
      <option value="closed">Full correction</option>
    </select></label>
  <details class="more">
    <summary>More</summary>
    <div>
      <label title="GPS timing offset. Empty = learned on the drive, as in the app">GPS lag <input id="lag" type="number" step="0.05" placeholder="learned" style="width:80px" /> s</label>
      <label title="Start the session this far into the log, as if the app started then">Start at <input id="start" type="number" step="10" min="0" placeholder="0" style="width:80px" /> s</label>
      <label title="Compass at a jammed start (MAPMATCH-SPEC §8.2), calibrated on the other logs; turned = a wrong calibration">Compass
        <select id="compass"><option value="">off</option><option value="on">from other logs</option><option value="90">turned 90°</option><option value="180">turned 180°</option></select></label>
    </div>
  </details>
  <span id="status"></span>
</header>
<main>
  <div class="mapwrap">
    <div id="map"></div>
    <details class="layers">
      <summary>Layers</summary>
      <label><input id="showFixes" type="checkbox" checked /> every GPS fix</label>
      <label title="From each dot to where GPS says the car is"><input id="showErr" type="checkbox" checked /> distance lines</label>
      <label title="Road graph used for map matching: lines by class, arrows on one-ways"><input id="showRoads" type="checkbox" /> roads (map matching)</label>
      <label title="The road the car was on, matched offline from clean GPS (MAPMATCH-SPEC §10.1); × marks breaks"><input id="showTruth" type="checkbox" /> true path</label>
      <label title="Map matching inside the replay: particles (size by weight; hollow = off-road) and its hypotheses (ring = spread, label = weight)"><input id="showMm" type="checkbox" /> map-matching particles</label>
      <label title="The route the phone planned (pink), its maneuvers, and the routes it replaced (grey)"><input id="showRoute" type="checkbox" checked /> planned route</label>
    </details>
  </div>
  <aside>
    <div id="drive"></div>
    <h2>Tracks</h2>
    <div class="tracks" id="tracks"></div>
    <div id="routeBox" hidden>
      <h2>Route</h2>
      <div id="route"></div>
    </div>
    <h2>Without GPS</h2>
    <div id="outages"></div>
    <h2>At the cursor</h2>
    <div id="now"></div>
    <details class="box" id="eventsBox">
      <summary>Events</summary>
      <label><input id="allEvents" type="checkbox" /> include link and sensor messages</label>
      <ul id="events"></ul>
    </details>
    <details class="box">
      <summary>Replay details</summary>
      <div id="summary"></div>
    </details>
  </aside>
</main>
<canvas id="timeline" aria-label="Timeline: click or drag to seek"></canvas>
<div class="controls">
  <button id="play" title="Space">▶ Play</button>
  <select id="speed" aria-label="Playback speed">
    <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option>
    <option value="10" selected>10×</option><option value="30">30×</option><option value="60">60×</option>
  </select>
  <button id="back" title="← (Shift: 30 s)">−5 s</button>
  <button id="fwd" title="→ (Shift: 30 s)">+5 s</button>
  <span id="time"></span>
  <button id="follow" aria-pressed="true">Follow</button>
  <span class="muted" style="margin-left:auto">Map: OpenFreeMap (online)</span>
</div>

<script>
"use strict";
const STYLE = "https://tiles.openfreemap.org/styles/liberty";
const showError = (msg) => { const el = document.getElementById("status"); if (el) el.textContent = "error: " + msg; };
window.addEventListener("error", (e) => showError(e.message));
window.addEventListener("unhandledrejection", (e) => showError(e.reason?.stack ?? e.reason));
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let data = null;
let t = 0;
let playing = false;
let lastFrame = 0;
let follow = true;
let roads = null;
let truth = null;
let activeOutage = -1;

/** Clean satellite fixes are the truth (the replay's rule). */
const TRUTH_ACC_M = 10;
const OUTAGE_NAMES = { "no-gps": "No GPS", "app-cut": "Cut GPS (app)", "replay-cut": "Cut in replay" };

// The tracks the map can show: what the phone showed, the replay, and a second replay to compare.
const TRACKS = [
  { key: "phone", color: "--phone", label: () => "Phone (as driven)", points: () => data.phone },
  { key: "replay", color: "--pred", label: () => `Replay · ${data.loopLabel}`, points: () => data.shown },
  { key: "compare", color: "--cmp", label: () => `Compare · ${data.compare?.label ?? ""}`, points: () => data.compare?.shown ?? [] },
];
const trackOn = { phone: true, replay: true, compare: true };
try { Object.assign(trackOn, JSON.parse(localStorage.getItem("replay.tracks") ?? "{}")); } catch {}
const present = (tr) => data && tr.points().length > 0;
const visible = () => TRACKS.filter((tr) => present(tr) && trackOn[tr.key]);

// ---------- geometry ----------
const R = 6371000;
const rad = (d) => (d * Math.PI) / 180;
function haversine(a, b) {
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function offset(p, bearingDeg, m) {
  const b = rad(bearingDeg);
  return [p.lon + (m * Math.sin(b)) / (R * Math.cos(rad(p.lat))) * (180 / Math.PI), p.lat + ((m * Math.cos(b)) / R) * (180 / Math.PI)];
}
function circle(p, m, steps = 64) {
  const ring = [];
  for (let i = 0; i <= steps; i++) ring.push(offset(p, (i / steps) * 360, m));
  return { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [ring] } };
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fc = (features) => ({ type: "FeatureCollection", features });
const pt = (p, props = {}) => ({ type: "Feature", properties: props, geometry: { type: "Point", coordinates: [p.lon, p.lat] } });
const line = (coords, props = {}) => ({ type: "Feature", properties: props, geometry: { type: "LineString", coordinates: coords } });

/** Last index with key(arr[i]) ≤ time, or −1. */
function indexAt(arr, time, key = (x) => x.t) {
  let lo = 0, hi = arr.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (key(arr[mid]) <= time) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
/** A packed track [t, lat, lon, acc][] at a time, interpolated; null outside it or across a gap > 2 s. */
function shownAt(arr, time) {
  const i = indexAt(arr, time, (x) => x[0]);
  if (i < 0) return null;
  const a = arr[i], b = arr[i + 1];
  if (!b || b[0] - a[0] > 2) return time - a[0] <= 2 ? { t: time, lat: a[1], lon: a[2], acc: a[3] } : null;
  const f = (time - a[0]) / (b[0] - a[0]);
  return { t: time, lat: a[1] + (b[1] - a[1]) * f, lon: a[2] + (b[2] - a[2]) * f, acc: a[3] + (b[3] - a[3]) * f };
}
function lastBefore(arr, time) { const i = indexAt(arr, time, (x) => x[0] ?? x.t); return i < 0 ? null : arr[i]; }
/** The newest fix at the cursor, and the newest clean satellite one (the truth) within 2 s. */
function fixesAt(time) {
  const i = indexAt(data.fixes, time);
  const fix = i < 0 ? null : data.fixes[i];
  let truthFix = null;
  for (let j = i; j >= 0 && time - data.fixes[j].t <= 2; j--) {
    const f = data.fixes[j];
    if (f.sat && f.acc <= TRUTH_ACC_M) { truthFix = f; break; }
  }
  return { fix, truthFix };
}

// ---------- formatting ----------
const fmtT = (s) => { const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(1).padStart(4, "0")}`; };
const fmtMin = (s) => { s = Math.round(s); return s < 60 ? `${s} s` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} min`; };
const fmtKm = (m) => m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(2)} km`;
const fmtM = (m) => m == null ? "—" : `${m < 10 ? m.toFixed(1) : Math.round(m)} m`;
const grade = (m) => m == null ? "" : m < 10 ? "good" : m < 30 ? "meh" : "poor";
const utc = (s) => data.startUtcMs == null ? "" : new Date(data.startUtcMs + s * 1000).toISOString().slice(11, 19) + " UTC";
function driveName(file) {
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})_(\w+)/.exec(file);
  return m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]} · ${m[7]}` : file;
}

// ---------- map ----------
const map = new maplibregl.Map({ container: "map", style: STYLE, center: [30.76, 51.52], zoom: 13, attributionControl: { compact: true } });
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
map.ready = new Promise((resolve) => map.once("style.load", () => { addLayers(); resolve(); }));
map.on("dragstart", () => setFollow(false));
map.on("error", (e) => showError(`map: ${e.error?.message ?? e.error}`));

function addLayers() {
  const empty = fc([]);
  const sources = ["roads", "roadNodes", "truth", "truthBreaks", "particles", "clusters", "fixes", "gpsTrack", "gpsNow", "gpsAcc", "routeOld", "routeLine", "routeManeuvers"];
  for (const tr of TRACKS) sources.push(`${tr.key}Line`, `${tr.key}Now`, `${tr.key}Acc`, `${tr.key}Err`);
  for (const id of sources) map.addSource(id, { type: "geojson", data: empty });
  addRoadLayers();
  // The phone's planned route (ROUTING-SPEC §8): the one in force at the cursor, and those it replaced.
  map.addLayer({ id: "routeOld", type: "line", source: "routeOld", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": css("--text2"), "line-width": 3, "line-opacity": 0.35, "line-dasharray": [2, 2] } });
  map.addLayer({ id: "routeLine", type: "line", source: "routeLine", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": css("--route"), "line-width": 6, "line-opacity": 0.45 } });
  map.addLayer({ id: "routeManeuvers", type: "circle", source: "routeManeuvers",
    paint: { "circle-radius": ["case", ["get", "next"], 6, 4], "circle-color": css("--panel"), "circle-stroke-color": css("--route"), "circle-stroke-width": 2.5 } });
  map.addLayer({ id: "routeManeuverLabels", type: "symbol", source: "routeManeuvers", minzoom: 14,
    layout: { "text-field": ["get", "label"], "text-size": 11, "text-offset": [0, 1.1], "text-anchor": "top", "text-font": ["Noto Sans Regular"] },
    paint: { "text-color": css("--route"), "text-halo-color": css("--panel"), "text-halo-width": 1.5 } });
  map.addLayer({ id: "gpsTrack", type: "line", source: "gpsTrack", paint: { "line-color": css("--gps"), "line-width": 2, "line-opacity": 0.5 } });
  map.addLayer({ id: "fixes", type: "circle", source: "fixes",
    paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 12, 1.8, 17, 4],
      "circle-color": ["case", ["==", ["get", "kind"], "truth"], css("--gps"), ["==", ["get", "kind"], "coarse"], css("--coarse"), css("--gps")],
      "circle-opacity": ["case", ["==", ["get", "kind"], "weak"], 0.35, 0.75] } });
  addMapMatchLayers();
  for (const tr of TRACKS) {
    const c = css(tr.color);
    map.addLayer({ id: `${tr.key}Line`, type: "line", source: `${tr.key}Line`, layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": c, "line-width": tr.key === "phone" ? 4 : 3, "line-opacity": 0.85 } });
  }
  map.addLayer({ id: "gpsAcc", type: "fill", source: "gpsAcc", paint: { "fill-color": css("--gps"), "fill-opacity": 0.1 } });
  for (const tr of TRACKS) {
    const c = css(tr.color);
    map.addLayer({ id: `${tr.key}Acc`, type: "fill", source: `${tr.key}Acc`, paint: { "fill-color": c, "fill-opacity": 0.08 } });
    map.addLayer({ id: `${tr.key}AccLine`, type: "line", source: `${tr.key}Acc`, paint: { "line-color": c, "line-width": 1.3, "line-opacity": 0.8 } });
    map.addLayer({ id: `${tr.key}Err`, type: "line", source: `${tr.key}Err`, paint: { "line-color": c, "line-width": 2, "line-dasharray": [1.5, 1.5] } });
  }
  map.addLayer({ id: "gpsNow", type: "circle", source: "gpsNow",
    paint: { "circle-radius": 6, "circle-color": css("--gps"), "circle-opacity": ["get", "opacity"],
      "circle-stroke-width": 2, "circle-stroke-color": "#fff", "circle-stroke-opacity": ["get", "opacity"] } });
  for (const tr of TRACKS) {
    map.addLayer({ id: `${tr.key}Now`, type: "circle", source: `${tr.key}Now`,
      paint: { "circle-radius": 7, "circle-color": css(tr.color), "circle-stroke-width": 2.5, "circle-stroke-color": "#fff" } });
  }
  const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
  map.on("mouseenter", "fixes", (e) => {
    map.getCanvas().style.cursor = "pointer";
    const p = e.features[0].properties;
    popup.setLngLat(e.lngLat).setHTML(`<b>${fmtT(+p.t)}</b> ${p.sat ? "satellite" : "Wi-Fi/cell"} ±${p.acc} m` +
      (p.status === "cut" ? "<br>withheld from the replay" : p.status === "rejected" ? "<br>rejected by the replay" : "")).addTo(map);
  });
  map.on("mouseleave", "fixes", () => { map.getCanvas().style.cursor = ""; popup.remove(); });
  map.on("click", "fixes", (e) => seek(+e.features[0].properties.t));
}

const ROAD_CLASSES = ["motorway", "trunk", "primary", "secondary", "tertiary", "unclassified", "residential",
  "living_street", "service", "track", "road"];
const EDGE_FLAGS = [[1, "link"], [2, "roundabout"], [4, "tunnel"], [8, "bridge"], [16, "private"], [32, "minor service"]];

function addRoadLayers() {
  const major = ["<=", ["get", "cls"], 4];
  const minor = ["any", ["==", ["get", "cls"], 8], ["==", ["get", "cls"], 9]];
  map.addLayer({ id: "roads", type: "line", source: "roads", filter: ["!", minor], layout: { "line-cap": "round" },
    paint: { "line-color": css("--road"), "line-opacity": ["case", major, 0.6, 0.4],
      "line-width": ["interpolate", ["linear"], ["zoom"], 12, ["case", major, 1.5, 1], 17, ["case", major, 6, 4]] } });
  map.addLayer({ id: "roadsMinor", type: "line", source: "roads", filter: minor,
    paint: { "line-color": css("--road"), "line-opacity": 0.35, "line-width": ["interpolate", ["linear"], ["zoom"], 12, 0.75, 17, 3], "line-dasharray": [2, 1.5] } });
  map.addLayer({ id: "roadsOneway", type: "symbol", source: "roads", filter: ["==", ["get", "ow"], 1], minzoom: 14,
    layout: { "symbol-placement": "line", "symbol-spacing": 70, "text-field": "→", "text-font": ["Noto Sans Regular"],
      "text-size": 14, "text-keep-upright": false, "text-allow-overlap": true },
    paint: { "text-color": css("--road"), "text-halo-color": css("--panel"), "text-halo-width": 1 } });
  map.addLayer({ id: "truth", type: "line", source: "truth", layout: { "line-cap": "round" },

  map.addLayer({ id: "truthBreaks", type: "symbol", source: "truthBreaks",

    paint: { "text-color": css("--rej"), "text-halo-color": css("--panel"), "text-halo-width": 1.5 } });
  map.addLayer({ id: "roadNodes", type: "circle", source: "roadNodes", minzoom: 15,
    paint: { "circle-radius": ["case", [">", ["get", "fl"], 0], 4, 2.5],
      "circle-color": ["case", ["==", ["%", ["get", "fl"], 2], 1], css("--rej"), [">", ["get", "fl"], 0], css("--road-end"), css("--road")],
      "circle-stroke-width": 1, "circle-stroke-color": css("--panel") } });
  const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
  for (const id of ["roads", "roadsMinor"]) {
    map.on("mousemove", id, (e) => {
      const p = e.features[0].properties;
      const flags = EDGE_FLAGS.filter(([bit]) => p.fl & bit).map(([, name]) => name);
      popup.setLngLat(e.lngLat).setHTML(`<b>${ROAD_CLASSES[p.cls] ?? p.cls}</b> · way ${p.way}<br>${p.len} m` +
        (p.ow ? " · one-way" : "") + (flags.length ? `<br>${flags.join(", ")}` : "")).addTo(map);
    });
    map.on("mouseleave", id, () => popup.remove());
  }
  map.on("mousemove", "truthBreaks", (e) => {
    const p = e.features[0].properties;
    const why = p.reason === "no candidates" ? `no road within 30 m (${p.fixes} fixes): off the graph`
      : p.reason === "gap" ? `no clean fix for ${Math.round(p.t1 - p.t0)} s` : "no route fits the OBD distance";
    popup.setLngLat(e.lngLat).setHTML(`<b>true path break</b> ${fmtT(p.t0)}–${fmtT(p.t1)}<br>${why}`).addTo(map);
  });
  map.on("mouseleave", "truthBreaks", () => popup.remove());
}

/** Lines and GPS fixes: change only with the data or the layer switches. */
async function setStatic() {
  await map.ready;
  for (const tr of TRACKS) {
    const on = present(tr) && trackOn[tr.key];
    const segs = [];
    let cur = null, prev = null;
    if (on) for (const p of tr.points()) {
      if (!cur || p[0] - prev[0] > 3) { cur = []; segs.push(cur); }
      cur.push([p[2], p[1]]);
      prev = p;
    }
    map.getSource(`${tr.key}Line`).setData(fc(segs.filter((s) => s.length > 1).map((s) => line(s))));
  }
  const sats = data.fixes.filter((f) => f.sat && f.acc <= 50);
  map.getSource("gpsTrack").setData(fc(sats.length > 1 ? [line(sats.map((f) => [f.lon, f.lat]))] : []));
  map.getSource("fixes").setData(fc($("showFixes").checked
    ? data.fixes.map((f) => pt(f, { t: f.t, sat: f.sat, acc: f.acc, status: f.status, kind: !f.sat ? "coarse" : f.acc <= TRUTH_ACC_M ? "truth" : "weak" })) : []));
}

/** Dots, circles and distance lines at the cursor. */
function updateMap() {
  const { fix, truthFix } = fixesAt(t);
  const age = fix ? t - fix.t : Infinity;
  for (const tr of TRACKS) {
    const p = present(tr) && trackOn[tr.key] ? shownAt(tr.points(), t) : null;
    map.getSource(`${tr.key}Now`).setData(fc(p ? [pt(p)] : []));
    map.getSource(`${tr.key}Acc`).setData(fc(p ? [circle(p, Math.max(1, p.acc))] : []));
    map.getSource(`${tr.key}Err`).setData(fc(p && truthFix && $("showErr").checked ? [line([[p.lon, p.lat], [truthFix.lon, truthFix.lat]])] : []));
  }
  map.getSource("gpsNow").setData(fc(fix ? [pt(fix, { opacity: age < 3 ? 1 : age < 15 ? 0.5 : 0.2 })] : []));
  map.getSource("gpsAcc").setData(fc(fix && age < 3 ? [circle(fix, Math.max(1, fix.acc))] : []));
  updateMapMatch();
  updateRoute();
  const lead = visible()[0];
  const p = lead ? shownAt(lead.points(), t) : null;
  if (follow && p) map.jumpTo({ center: [p.lon, p.lat] });
}

/** The plan in force at `time` (the last one made by then that succeeded), and the guidance then. */
function routeAt(time) {
  const plans = data.routes?.plans ?? [];
  let plan = null;
  for (const p of plans) if (p.t <= time && p.status === "done") plan = p;
  const g = lastBefore(data.routes?.progress ?? [], time);
  return { plan, g: g && time - g[0] < 3 ? g : null };
}

function updateRoute() {
  const on = $("showRoute").checked && data.routes?.plans.length;
  const { plan, g } = on ? routeAt(t) : { plan: null, g: null };
  const old = on ? data.routes.plans.filter((p) => p !== plan && p.t <= t && p.status === "done" && p.reason !== "resume") : [];
  map.getSource("routeOld").setData(fc(old.filter((p) => p.points.length > 1).map((p) => line(p.points.map(([la, lo]) => [lo, la])))));
  map.getSource("routeLine").setData(fc(plan && plan.points.length > 1 ? [line(plan.points.map(([la, lo]) => [lo, la]))] : []));
  const next = g && plan && g[1] === plan.id ? g[6] : -1;
  map.getSource("routeManeuvers").setData(fc(plan ? plan.maneuvers.map((m, i) =>
    pt(m, { next: i === next, label: m.kind === "roundabout" ? `roundabout ${m.exit}` : m.kind })) : []));
}

function renderRoute() {
  const plans = data.routes?.plans ?? [];
  $("routeBox").hidden = !plans.length;
  if (!plans.length) return;
  const arrived = data.events.find((e) => e.text.startsWith("route arrived"));
  const offs = data.routes.progress.filter((g, i, a) => g[2] === "off" && a[i - 1]?.[2] !== "off").length;
  $("route").innerHTML = `<div class="facts">` +
    plans.map((p) => `<div class="route-plan" data-t="${p.t}"><b>${fmtT(p.t)}</b> ${esc(p.reason)}: ` +
      (p.status === "done" ? `<b>${fmtKm(p.lengthM)}</b>, ${Math.round(p.durationS / 60)} min planned` : `<span class="bad">${esc(p.status)}</span>`) +
      (p.reason === "resume" ? "" : ` · planned in <b>${Math.round(p.planMs)} ms</b>${p.slices > 1 ? ` (${p.slices} slices, ${Math.round(p.wallMs)} ms wall)` : ""}`) + `</div>`).join("") +
    `<div class="muted" style="margin-top:4px">${offs ? `${offs}× off the route` : "never off the route"}` +
    (arrived ? ` · ${esc(arrived.text.replace(/^route arrived [^:]*: /, "arrived: "))}` : "") + `</div></div>` +
    `<div id="routeNow" class="muted" style="margin-top:6px"></div>`;
  for (const el of $("route").querySelectorAll(".route-plan")) { el.style.cursor = "pointer"; el.onclick = () => seek(+el.dataset.t); }
}

/** Guidance at the cursor, under the route's plans. */
function renderRouteNow() {
  const el = $("routeNow");
  if (!el) return;
  const { plan, g } = routeAt(t);
  if (!plan || !g) { el.textContent = plan ? "guidance: not running at the cursor" : "no route yet at the cursor"; return; }
  const [, , state, along, off, toNext, nextIndex] = g;
  const next = plan.maneuvers[nextIndex];
  el.innerHTML = `guidance: <b>${esc(state)}</b>${off === null ? ", nothing matched" : `, ${Math.round(off)} m off the route`} · ` +
    `${fmtKm(along)} of ${fmtKm(plan.lengthM)}` + (next ? ` · next <b>${esc(next.kind === "roundabout" ? `roundabout exit ${next.exit}` : next.kind)}</b> in ${fmtM(toNext)}` : "");
}

function updateMapMatch() {
  const on = $("showMm").checked;
  const snap = on && data.particles?.length ? lastBefore(data.particles, t) : null;
  const pts = snap && t - snap[0] < 1.5 ? snap[1] : [];
  const maxW = pts.reduce((m, q) => Math.max(m, q[2]), 0) || 1;
  map.getSource("particles").setData(fc(pts.map(([lat, lon, w, off]) => pt({ lat, lon }, { rel: w / maxW, off }))));
  const i = indexAt(data.track, t);
  const mm = on && i >= 0 ? data.track[i].mm : null;
  map.getSource("clusters").setData(fc(mm ? mm.c.map(([lat, lon, w, spread, road], rank) =>
    pt({ lat, lon }, { rank, spread: Math.max(spread, 2), label: `${Math.round(w * 100)}%${road ? "" : " off-road"}${rank === 0 ? ` · ${mm.s}` : ""}` })) : []));
}

  $("tracks").innerHTML = [

/** Did this track have GPS in this window (so its score says nothing)? */
function hadGps(key, o) {
  if (key === "phone") return o.kind === "replay-cut";
  return o.kind === "app-cut" && $("gps").value !== "app";
}

function scoreRow(tr, sc, o) {
  if (!sc) return `<div class="row"><span class="swatch" style="background:var(${tr.color})"></span><span class="muted">no data</span></div>`;
  const parts = [];
  if (sc.truthFixes) {
    parts.push(`end <span class="num ${grade(sc.endErrorM)}">${fmtM(sc.endErrorM)}</span>`);
    parts.push(`worst <span class="num ${grade(sc.maxErrorM)}">${fmtM(sc.maxErrorM)}</span>`);
    parts.push(`in circle ${Math.round(100 * sc.insideShare)} %`);
  } else if (sc.afterErrorM != null) {
    parts.push(`off by <span class="num ${grade(sc.afterErrorM)}">${fmtM(sc.afterErrorM)}</span> when GPS came back` +
      (sc.afterInside ? " (inside its circle)" : " (outside its circle)"));
  }
  return `<div class="row"><span class="swatch" style="background:var(${tr.color})"></span><span>${parts.join(" · ") || "—"}</span></div>`;
}

function renderOutages() {
  const shown = TRACKS.filter((tr) => present(tr) && trackOn[tr.key]);
  if (!data.outages.length) {
    $("outages").innerHTML = `<div class="muted">GPS was good the whole drive, so there is nothing to compare: the dot followed GPS. ` +
      `Use Cut GPS in the app on your next drive, or pick “Cut at…” above to try it here.</div>`;
    return;
  }
  $("outages").innerHTML = data.outages.map((o, i) => {
    const rows = shown.filter((tr) => !hadGps(tr.key, o)).map((tr) => scoreRow(tr, o.scores[tr.key], o)).join("");
    return `<div class="outage ${i === activeOutage ? "active" : ""}" data-i="${i}">` +
      `<div class="head"><span class="swatch" style="background:var(--${o.kind === "no-gps" ? "nogps" : o.kind === "app-cut" ? "appcut" : "replaycut"})"></span>` +
      `<span class="kind">${OUTAGE_NAMES[o.kind]}</span><span class="muted">${fmtMin(o.toS - o.fromS)} · ${fmtKm(o.distanceM)}</span>` +
      `<span class="when">${fmtT(o.fromS).replace(/\.\d$/, "")}</span></div>${rows || `<div class="muted">Every track had GPS here.</div>`}</div>`;
  }).join("");
  for (const el of $("outages").children) el.onclick = () => focusOutage(+el.dataset.i);
}

function focusOutage(i) {
  const o = data.outages[i];
  activeOutage = i;
  renderOutages();
  const pts = [];
  for (const tr of visible()) for (const p of tr.points()) if (p[0] >= o.fromS - 5 && p[0] <= o.toS + 5) pts.push([p[2], p[1]]);
  for (const f of data.fixes) if (f.sat && f.acc <= TRUTH_ACC_M && f.t >= o.fromS - 5 && f.t <= o.toS + 10) pts.push([f.lon, f.lat]);
  if (pts.length) {
    setFollow(false);
    map.fitBounds([[Math.min(...pts.map((p) => p[0])), Math.min(...pts.map((p) => p[1]))], [Math.max(...pts.map((p) => p[0])), Math.max(...pts.map((p) => p[1]))]],
      { padding: 60, duration: 400, maxZoom: 17 });
  }
  // The end of the stretch: where the dot was furthest from the car (or met GPS again).
  seek(Math.min(o.toS, data.durationS) - 0.1);
}

function renderNow() {
  const { fix, truthFix } = fixesAt(t);
  const age = fix ? t - fix.t : Infinity;
  const outage = data.outages.find((o) => t >= o.fromS && t < o.toS);
  const gpsText = outage?.kind === "app-cut" ? "withheld from the phone (Cut GPS): green dot is the real position"
    : !fix || age > 3 ? `none for ${fix ? Math.round(age) : "—"} s`
    : fix.sat ? `satellite ±${Math.round(fix.acc)} m` : `Wi-Fi/cell only ±${Math.round(fix.acc)} m (no satellites)`;
  const rows = visible().map((tr) => {
    const p = shownAt(tr.points(), t);
    if (!p) return `<div class="now-row"><span class="swatch" style="background:var(${tr.color})"></span><span class="muted">${esc(tr.label())}: not running</span></div>`;
    if (!truthFix) return `<div class="now-row"><span class="swatch" style="background:var(${tr.color})"></span><span>${esc(tr.label())}: ±${Math.round(p.acc)} m, nothing to compare with</span></div>`;
    const d = haversine(p, truthFix);
    return `<div class="now-row"><span class="swatch" style="background:var(${tr.color})"></span><span>` +
      `<span class="num big ${grade(d)}">${fmtM(d)}</span> from GPS · ${d <= p.acc ? "inside" : "outside"} its circle (±${Math.round(p.acc)} m)</span></div>`;
  }).join("");
  const obd = lastBefore(data.obd, t);
  $("now").innerHTML = `<div class="muted">${fmtT(t)} · ${utc(t)}</div>` +
    `<div class="now-row"><span class="swatch" style="background:var(--gps)"></span><span>GPS: ${gpsText}</span></div>` + rows +
    `<div class="muted" style="margin-top:4px">Speed ${obd ? `${obd[1]} km/h (OBD)` : "—"}</div>`;
  for (const li of $("events").children) li.classList.toggle("past", +li.dataset.t <= t);
  renderRouteNow();
}

// ---------- timeline ----------
const tl = $("timeline");
const PAD_L = 52, PAD_R = 12;
const ROWS = { err: [8, 96], speed: [106, 134], gps: [142, 154], route: [158, 168] };
const ROUTE_STATE_COLOR = { on: "--route", leaving: "--warn", off: "--bad", unsure: "--nogps", arrived: "--ok" };
const ERR_MAX = 300;
function x(time) { return PAD_L + (time / data.durationS) * (tl.clientWidth - PAD_L - PAD_R); }
function tAtX(px) { return Math.max(0, Math.min(data.durationS, ((px - PAD_L) / (tl.clientWidth - PAD_L - PAD_R)) * data.durationS)); }

function drawTimeline() {
  const dpr = window.devicePixelRatio || 1;
  const w = tl.clientWidth, h = tl.clientHeight;
  if (tl.width !== w * dpr || tl.height !== h * dpr) { tl.width = w * dpr; tl.height = h * dpr; }
  const g = tl.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (!data) return;
  const text2 = css("--text2"), lineC = css("--line");
  g.font = "11px system-ui, sans-serif";

  // Stretches without GPS behind everything.
  for (const o of data.outages) {
    g.fillStyle = css(o.kind === "no-gps" ? "--nogps" : o.kind === "app-cut" ? "--appcut" : "--replaycut") + "26";
    g.fillRect(x(o.fromS), 0, Math.max(2, x(o.toS) - x(o.fromS)), ROWS.speed[1]);
  }

  // How far each dot was from GPS (log scale, 1–300 m).
  const [e0, e1] = ROWS.err;
  const ye = (m) => e1 - (Math.log10(Math.max(1, Math.min(ERR_MAX, m))) / Math.log10(ERR_MAX)) * (e1 - e0);
  g.strokeStyle = lineC; g.lineWidth = 1;
  for (const m of [1, 3, 10, 30, 100, 300]) { g.beginPath(); g.moveTo(PAD_L, ye(m)); g.lineTo(w - PAD_R, ye(m)); g.stroke(); }
  g.fillStyle = text2;
  g.fillText("off by", 4, e0 + 9);
  for (const m of [3, 10, 30, 100]) g.fillText(`${m} m`, 8, ye(m) + 4);
  for (const tr of visible()) {
    const errs = data.errors[tr.key] ?? [];
    g.strokeStyle = css(tr.color); g.lineWidth = 1.6; g.beginPath();
    let prev = null;
    for (const [tt, e] of errs) {
      if (!prev || tt - prev > 3) g.moveTo(x(tt), ye(e)); else g.lineTo(x(tt), ye(e));
      prev = tt;
    }
    g.stroke();
    // Outside its circle: a dot on the line.
    g.fillStyle = css(tr.color);
    for (const [tt, e, inside] of errs) if (!inside && e > 3) { g.beginPath(); g.arc(x(tt), ye(e), 1.8, 0, 7); g.fill(); }
  }

  // Speed (OBD).
  const [s0, s1] = ROWS.speed;
  const maxKph = Math.max(20, ...data.obd.map((o) => o[1]));
  const ys = (v) => s1 - (v / maxKph) * (s1 - s0);
  g.fillStyle = text2; g.fillText("km/h", 4, s0 + 9); g.fillText(String(Math.round(maxKph)), 4, s0 + 22);
  g.strokeStyle = text2; g.lineWidth = 1; g.globalAlpha = 0.7; g.beginPath();
  data.obd.forEach(([tt, v], i) => (i ? g.lineTo(x(tt), ys(v)) : g.moveTo(x(tt), ys(v))));
  g.stroke(); g.globalAlpha = 1;

  // GPS: green = good satellite fix, pale = weak, amber = Wi-Fi/cell only, blank = none. Red ticks: markers.
  const [b0, b1] = ROWS.gps;
  g.fillStyle = text2; g.fillText("GPS", 4, b1 - 1);
  for (let i = 0; i < data.fixes.length; i++) {
    const f = data.fixes[i], next = data.fixes[i + 1];
    const end = Math.min(next ? next.t : f.t + 1, f.t + 2);
    g.fillStyle = !f.sat ? css("--coarse") : f.acc <= TRUTH_ACC_M ? css("--gps") : css("--gps") + "66";
    g.fillRect(x(f.t), b0, Math.max(1, x(end) - x(f.t)), b1 - b0);
  }
  for (const e of data.events) {
    if (e.kind !== "marker" && e.text !== "marker") continue;
    g.fillStyle = css("--rej"); g.fillRect(x(e.t) - 1, b0 - 4, 2, b1 - b0 + 4);
  }

  // Route guidance: pink = on the route, amber = leaving it, red = off (plans again), grey = unsure; ticks = plans.
  const progress = data.routes?.progress ?? [];
  if (progress.length) {
    const [r0, r1] = ROWS.route;
    g.fillStyle = text2; g.fillText("route", 4, r1 - 1);
    for (let i = 0; i < progress.length; i++) {
      const p = progress[i], next = progress[i + 1];
      const end = Math.min(next ? next[0] : p[0] + 1, p[0] + 3);
      g.fillStyle = css(ROUTE_STATE_COLOR[p[2]] ?? "--text2") + (p[2] === "on" ? "88" : "");
      g.fillRect(x(p[0]), r0, Math.max(1, x(end) - x(p[0])), r1 - r0);
    }
    for (const plan of data.routes.plans) { g.fillStyle = css("--route"); g.fillRect(x(plan.t) - 1, r0 - 3, 2, r1 - r0 + 3); }
  }

  // Playhead.
  g.strokeStyle = css("--text"); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(x(t), 0); g.lineTo(x(t), h); g.stroke();
  $("time").textContent = `${fmtT(t)} / ${fmtT(data.durationS)}  ${utc(t)}`;
}

let dragging = false;
tl.addEventListener("pointerdown", (e) => { if (!data) return; dragging = true; tl.setPointerCapture(e.pointerId); seek(tAtX(e.offsetX)); });
tl.addEventListener("pointermove", (e) => { if (dragging) seek(tAtX(e.offsetX)); });
tl.addEventListener("pointerup", () => (dragging = false));

// ---------- playback ----------
function updateDynamic() {
  if (!data) return;
  updateMap();
  renderNow();
  drawTimeline();
}
function seek(time) {
  if (!data) return;
  t = Math.max(0, Math.min(data.durationS, time));
  updateDynamic();
}
function setPlaying(on) {
  playing = on && !!data;
  $("play").textContent = playing ? "❚❚ Pause" : "▶ Play";
  if (playing) { lastFrame = performance.now(); requestAnimationFrame(frame); }
}
function frame(now) {
  if (!playing) return;
  t += ((now - lastFrame) / 1000) * Number($("speed").value);
  lastFrame = now;
  if (t >= data.durationS) { t = data.durationS; setPlaying(false); }
  updateDynamic();
  if (playing) requestAnimationFrame(frame);
}
function setFollow(on) { follow = on; $("follow").setAttribute("aria-pressed", String(on)); }

$("play").onclick = () => setPlaying(!playing);
$("back").onclick = () => seek(t - 5);
$("fwd").onclick = () => seek(t + 5);
$("follow").onclick = () => { setFollow(!follow); updateDynamic(); };
$("showFixes").onchange = () => data && setStatic();
$("showErr").onchange = () => updateDynamic();
$("showRoads").onchange = () => setRoads();
$("showTruth").onchange = () => setTruth();
$("showMm").onchange = () => updateDynamic();
$("showRoute").onchange = () => updateDynamic();
$("allEvents").onchange = () => data && renderEvents();
document.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.code === "ArrowLeft") seek(t - (e.shiftKey ? 30 : 5));
  if (e.code === "ArrowRight") seek(t + (e.shiftKey ? 30 : 5));
});
window.addEventListener("resize", drawTimeline);

// ---------- loading ----------
const PARAMS = ["file", "loop", "gps", "cut", "compare", "lag", "start", "compass"];
function syncCutInput() {
  const g = $("gps").value;
  $("cut").hidden = g !== "cut" && g !== "jam";
  $("cut").placeholder = g === "jam" ? "start:length s, empty = all drive" : "start:length s, e.g. 120:240";
}

async function loadList() {
  const logs = await (await fetch("/api/logs")).json();
  $("file").innerHTML = logs.map((l) => `<option value="${l.file}">${esc(driveName(l.file))} (${l.sizeMb} MB)</option>`).join("");
  const params = new URLSearchParams(location.hash.slice(1));
  for (const k of PARAMS) if (params.get(k)) $(k).value = params.get(k);
  syncCutInput();
  if (!logs.length) { $("status").textContent = "No trip logs in the logs folder yet."; return; }
  await run();
  if (params.get("t")) seek(Number(params.get("t")));
}

async function run() {
  const file = $("file").value;
  if (!file) return;
  const q = Object.fromEntries(PARAMS.map((k) => [k, $(k).value.replace(/\s+/g, "")]));
  if (q.gps !== "cut" && q.gps !== "jam") q.cut = "";
  history.replaceState(null, "", "#" + new URLSearchParams(q).toString());
  setPlaying(false);
  activeOutage = -1;
  $("status").textContent = "replaying…";
  const started = performance.now();
  const res = await fetch(`/api/replay?${new URLSearchParams(q)}`);
  if (!res.ok) { $("status").textContent = await res.text(); return; }
  const payload = await res.json();
  if (!payload.outages) { $("status").textContent = "The viewer server is older than this page: stop it and run npm run replay:view again."; return; }
  if ($("file").value !== file) return;
  data = payload;
  $("status").textContent = `replayed in ${((performance.now() - started) / 1000).toFixed(1)} s`;
  renderDrive();
  renderOutages();
  renderEvents();
  renderRoute();
  renderSummary();
  loadRoads(file);
  loadTruth(file);
  await setStatic();
  const pts = [...data.shown.map((p) => ({ lon: p[2], lat: p[1] })), ...data.fixes.filter((f) => f.sat && f.acc <= 50)];
  if (pts.length) {
    setFollow(false);
    map.fitBounds([[Math.min(...pts.map((p) => p.lon)), Math.min(...pts.map((p) => p.lat))], [Math.max(...pts.map((p) => p.lon)), Math.max(...pts.map((p) => p.lat))]], { padding: 40, duration: 0 });
  }
  seek(0);
}
for (const id of ["file", "loop", "compare", "compass"]) $(id).onchange = run;
$("gps").onchange = () => { syncCutInput(); if ($("gps").value !== "cut") run(); else $("cut").focus(); };
for (const id of ["cut", "lag", "start"]) $(id).addEventListener("keydown", (e) => e.key === "Enter" && run());
loadList();
</script>
</body>
</html>
