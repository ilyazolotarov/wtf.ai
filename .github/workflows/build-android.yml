name: Build Android APK

# Signed release APK for sideloading (no Play Store account, no EAS). Plan: docs/ANDROID-SPEC.md. One build for
# everyone: `variant` only names the file (and the manual-run default); the build does not differ. Phone ABIs only:
# the x86_64 build for emulators is build-android-emulator.yml, run by hand. No emulator test in CI (too slow);
# scripts/android-smoke.sh runs one against a local emulator.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Names the APK file; tester and ci are the same build (arm64, armeabi-v7a)."
        type: choice
        options: [tester, ci]
        default: tester
      notify:
        description: "Send the APK to Telegram"
        type: boolean
        default: true
  workflow_call:
    inputs:
      variant:
        type: string
        default: ci
      notify:
        # false for compile checks of branch pushes: the APK is only uploaded as an artifact.
        type: boolean
        default: false
      retention-days:
        type: number
        default: 14
      architectures:
        # build-android-emulator.yml passes x86_64.
        type: string
        default: arm64-v8a,armeabi-v7a
    outputs:
      runtime:
        # The OTA runtime of the APK (docs/OTA.md), empty for emulator builds: ci.yml registers it on main.
        value: ${{ jobs.build-android.outputs.runtime }}
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
    timeout-minutes: 45
    env:
      VARIANT: ${{ inputs.variant }}
      # A manual run of this workflow has no such input: phone ABIs.
      ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Caches are saved by main (and by android while it is the integration branch for Android:
      # main has no Android builds before the merge) and restored everywhere, so branch builds
      # don't evict them.
      SAVE_CACHES: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android' }}
      # Compiler cache for the C/C++ of React Native's CMake builds (app codegen, Reanimated,
      # Worklets, …). CMake reads the launcher from the environment when it configures.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        # Dependencies, wrapper and the Gradle build cache (--build-cache below).
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.SAVE_CACHES != 'true' }}

      - name: Install dependencies
        run: npm ci

      - name: Install ccache
        run: |
          command -v ccache || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ccache; }
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_MAXSIZE=2G"
            # The NDK's mtime changes with runner images; its content is what matters.
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_LOGFILE=$RUNNER_TEMP/ccache.log"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: android-ccache-${{ inputs.variant }}-${{ github.sha }}
          restore-keys: android-ccache-${{ inputs.variant }}-

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Restore signing key
        # Without the secrets the release APK is signed with the debug key (see plugins/android-build.js).
        # Such an APK installs fine but cannot be updated over a build signed with the real key.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key"
          fi

      - name: Build release APK
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          # arm64 = nearly every phone, armeabi-v7a = older and cheap 32-bit phones; x86_64 = emulators (manual build).
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures="$ARCHITECTURES" --no-daemon --build-cache

      - name: ccache statistics
        if: ${{ !cancelled() }}
        run: |
          ccache --show-stats --verbose || true
          # Did the CMake builds go through ccache at all?
          echo "ccache log: $(grep -c 'Command line' "$RUNNER_TEMP/ccache.log" 2>/dev/null || true) invocations"

      - name: Save ccache
        if: ${{ env.SAVE_CACHES == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "wtfai-${VARIANT}.apk"
          ls -l "wtfai-${VARIANT}.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "wtfai-${VARIANT}.apk" | head -3

      - name: Upload APK to install
        # The tester build always; the CI build when the plan wants it delivered (notify).
        if: ${{ inputs.variant != 'ci' || inputs.notify }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: wtfai-${{ inputs.variant }}.apk
          retention-days: ${{ inputs.retention-days || 14 }}

      - name: Send APK to Telegram
        if: ${{ inputs.notify && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        # A delivery problem must not fail the build: the artifact above is the source of truth.
        continue-on-error: true
        run: |
          APK="wtfai-${VARIANT}.apk"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          CAPTION="wtf.ai Android · ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}
          $(git log -1 --format=%s)
          ${RUN_URL}"
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          # Bot API uploads are limited to 50 MB; past that, send the link to the run instead.
          if [ "$(stat -c%s "$APK")" -lt 49000000 ]; then
            curl -sS --fail-with-body -o /dev/null -F chat_id="$TELEGRAM_CHAT_ID" -F caption="$CAPTION" -F document=@"$APK" "$API/sendDocument"
          else
            curl -sS --fail-with-body -o /dev/null --data-urlencode chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$CAPTION (APK over 50 MB: download it from the run)" "$API/sendMessage"
          fi

      - name: OTA runtime of the build
        # The fingerprint the build embedded, so the update Worker and the app cannot disagree (docs/OTA.md). Emulator
        # builds are not what phones run. ci.yml registers it, in the ota environment that holds the token.
        id: runtime
        if: ${{ env.ARCHITECTURES == 'arm64-v8a,armeabi-v7a' }}
        run: |
          RUNTIME=$(unzip -p "wtfai-${VARIANT}.apk" assets/fingerprint 2>/dev/null || true)
          if [ -n "$RUNTIME" ]; then
            echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
            echo "Runtime: $RUNTIME"
          else
            echo "::warning::No embedded fingerprint in the APK: JS updates will not be published for this build"
          fi
