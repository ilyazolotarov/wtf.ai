name: Website

# The project's website on GitHub Pages: site/ (the landing page; its screenshots and videos made from store-assets/play/ by scripts/site-media.sh) and
# the privacy policy, copied from docs/PRIVACY.md so the stores' privacy URL always shows the current one
# (docs/STORE-REVIEW.md §2). Needs Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "store-assets/play/**", "scripts/site-media.sh", "scripts/site-share-card.py", "docs/PRIVACY.md", "docs/PRIVACY.uk.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

# The support address (a repository variable, so the repo names none): the policy's contact and the site's footer.
# The update Worker (docs/OTA.md): the site's Android link is its /apps/android/latest.apk, the newest main build.
env:
  SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
  UPDATES_ORIGIN: ${{ vars.UPDATES_ORIGIN }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Only the LFS files the site needs: the store screenshots always, the promo videos when the site's encodes of
      # them are not cached. The rest of store-assets/ (and its LFS bandwidth) stays out.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: ffmpeg
        run: command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }

      # The site's screenshots and demo videos are made from the store set (scripts/site-media.sh): one copy in the repo.
      # The screenshots and the link preview cards made from them (scripts/site-share-card.py, Pillow).
      - name: Screenshots
        run: |
          pip install --quiet pillow
          git lfs pull --include "store-assets/play/*/*.png"
          bash scripts/site-media.sh screens

      # Keyed on the videos' LFS pointers (their content hash) and the script: a new recording or recipe encodes again.
      - name: Cached demo videos
        id: videos
        uses: actions/cache@v6
        with:
          path: site/assets/demo*.mp4
          key: site-videos-${{ hashFiles('store-assets/play/promo*.mp4', 'scripts/site-media.sh') }}

      - name: Demo videos
        if: steps.videos.outputs.cache-hit != 'true'
        run: |
          git lfs pull --include "store-assets/play/promo*.mp4"
          bash scripts/site-media.sh videos

      - name: Privacy policy page
        run: |
          { printf -- '---\nlayout: page\ntitle: Privacy policy\nlang: en\npermalink: /privacy.html\n---\n\n'; cat docs/PRIVACY.md; } > site/privacy.md
          { printf -- '---\nlayout: page\ntitle: Політика приватності\nlang: uk\npermalink: /privacy.uk.html\n---\n\n'; cat docs/PRIVACY.uk.md; } > site/privacy.uk.md

      - name: Support address
        run: |
          [ -n "$SUPPORT_EMAIL" ] || { echo "::error::No SUPPORT_EMAIL repository variable: the policy would have no contact"; exit 1; }
          sed -i "s|SUPPORT_EMAIL|[$SUPPORT_EMAIL](mailto:$SUPPORT_EMAIL)|g" site/privacy.md site/privacy.uk.md
          printf 'support_email: %s\n' "$SUPPORT_EMAIL" >> site/_config.yml

      - name: Android download link
        run: |
          [ -n "$UPDATES_ORIGIN" ] || { echo "::error::No UPDATES_ORIGIN repository variable: the site would have no APK link"; exit 1; }
          printf 'apk_url: %s/apps/android/latest.apk\n' "${UPDATES_ORIGIN%/}" >> site/_config.yml

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload site
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
