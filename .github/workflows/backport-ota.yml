name: Backport OTA Fix

# A JS fix for builds that no longer get JS updates (docs/OTA.md → Backporting a fix): for each target runtime, the
# commit whose JS its phones run now, patched by tools/ota/backports/<patch>.mjs, exported, signed and published
# for that runtime only. By hand, on main. Each target checks that its commit resolves to its runtime before anything
# is published, so JS never lands on other native code.
on:
  workflow_dispatch:
    inputs:
      patch:
        description: "tools/ota/backports/<patch>.mjs"
        type: string
        required: true
      platform:
        type: choice
        options: [android, ios]
        default: android
      targets:
        description: "runtime@commit, space-separated: the runtime and the full SHA of the JS its phones run (OTA.md)"
        type: string
        required: true

# Same values as publish-ota.yml: they are part of the runtime version and of the config an update carries.
env:
  UPDATES_ORIGIN: ${{ vars.UPDATES_ORIGIN }}
  TRIP_UPLOAD_ORIGIN: ${{ vars.TRIP_UPLOAD_ORIGIN }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
  PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
  SENTRY_URL: ${{ vars.SENTRY_URL }}

permissions:
  contents: read

jobs:
  targets:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse the targets
        id: parse
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          json=$(for t in $TARGETS; do
            [[ "$t" =~ ^([0-9a-f]{40})@([0-9a-f]{40})$ ]] || { echo "::error::$t is not runtime@commit (both 40 hex digits)" >&2; exit 1; }
            printf '{"runtime":"%s","commit":"%s"}\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}"
          done | jq -sc .)
          [ "$(jq length <<< "$json")" -gt 0 ] || { echo "::error::no targets"; exit 1; }
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  backport:
    needs: targets
    # The signing key and the publish token, main only (docs/OTA.md).
    environment: ota
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}
    name: backport ${{ inputs.platform }} ${{ matrix.target.runtime }}
    env:
      PLATFORM: ${{ inputs.platform }}
      PATCH: ${{ inputs.patch }}
      RUNTIME: ${{ matrix.target.runtime }}
      COMMIT: ${{ matrix.target.commit }}
      OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
    steps:
      - name: Checkout main (the tools and the patch)
        uses: actions/checkout@v7
        with:
          path: main

      - name: Checkout the target's commit
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target.commit }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: base/package-lock.json

      - name: Install the target's dependencies
        working-directory: base
        run: npm ci

      - name: Patch
        run: node "main/tools/ota/backports/$PATCH.mjs" base && git -C base status --short

      - name: Typecheck the patched JS
        working-directory: base
        run: |
          # Generated by expo start, ignored by git: the types of image and CSS imports.
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

      - name: Export
        working-directory: base
        env:
          # The commit whose JS this is: About, trip logs and Sentry name it as before.
          EXPO_PUBLIC_BUILD_SHA: ${{ matrix.target.commit }}
        run: npx expo export --platform "$PLATFORM" --output-dir dist

      - name: Sign
        # main's tools (the fixes since), the target's config and certificate; stops unless the target's commit
        # resolves to the runtime.
        working-directory: main
        run: >-
          npm run -s ota:prepare -- --project ../base --dist ../base/dist --out ../ota-out --platform "$PLATFORM"
          --commit "$COMMIT" --expect-runtime-$PLATFORM "$RUNTIME"

      - name: Publish
        # No --require-build: an old runtime's build record is pruned with its JS. The Worker keeps what this
        # publishes for 30 days (UPDATES-SPEC §2.1).
        working-directory: main
        run: npm run -s ota:publish -- --out ../ota-out
