name: Build Offline Map Packs

# Weekly: when Geofabrik has a newer Ukraine extract than the newest published maps, build
# Ukraine's tiles with Planetiler, cut every other region in tools/tiles/regions/regions.json
# from them (pmtiles extract), clip the extract per region (osmium) for the road graphs and
# search indexes (built in parallel), and publish tools/tiles/out/release/ (index.json, one
# <region>.pmtiles per region and the shared files) to the update Worker, where the app reads
# it (docs/UPDATES-SPEC.md §4); the Worker keeps one release. Also as GitHub release
# `maps-<osm_date>` for app JS older than the Worker's maps; older releases are pruned.
on:
  schedule:
    - cron: "0 4 * * 1" # Monday; Geofabrik refreshes extracts around 01–02 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if maps for the current OSM date exist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: map-packs
  cancel-in-progress: false

env:
  KEEP_RELEASES: 3
  # The update Worker's address (app.config.js): a repository variable, so the repo names no server. Unset: the maps go
  # to GitHub releases only.
  UPDATES_ORIGIN: ${{ vars.UPDATES_ORIGIN }}

jobs:
  map-packs:
    # The publish token is in the ota environment, which only main may use (docs/OTA.md).
    environment: ota
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/tiles/pyproject.toml

      - name: Install tools/tiles
        run: pip install -e tools/tiles

      - name: Check for a newer OSM extract
        id: check
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(tiles osm-date)
          if [ -n "$UPDATES_ORIGIN" ]; then
            current=$(curl -fsS "${UPDATES_ORIGIN%/}/maps/latest.json" | jq -r .osm_date || echo none)
          else
            current=$(gh release view "maps-$date" --json tagName -q .tagName 2>/dev/null | sed 's/^maps-//' || echo none)
          fi
          if [ "$FORCE" != "true" ] && [ "$current" = "$date" ]; then
            echo "maps $date already published"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building maps for Geofabrik extract $date"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        # Ukraine extract, 28 clipped extracts, Planetiler temp files and outputs need ~15 GB;
        # drop preinstalled SDKs we don't use.
        if: steps.check.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install osmium-tool
        if: steps.check.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool

      - name: Setup Java (Planetiler)
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Planetiler sources
        # Natural Earth, water polygons, lake centerlines (~1.3 GB, rarely change)
        if: steps.check.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: tools/tiles/cache/sources
          key: planetiler-sources-v1

      - name: Build maps
        if: steps.check.outputs.build == 'true'
        working-directory: tools/tiles
        run: |
          tiles build-all --heap 10g
          ls -l out/release/*.pmtiles

      - name: Setup Node.js
        if: steps.check.outputs.build == 'true' && env.UPDATES_ORIGIN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish to the update Worker
        # Files the Worker has (same size and MD5) are skipped, index.json goes last, then the release becomes current.
        if: steps.check.outputs.build == 'true' && env.UPDATES_ORIGIN != ''
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
        run: |
          [ -n "$OTA_PUBLISH_TOKEN" ] || { echo "::error::OTA_PUBLISH_TOKEN is missing from the ota environment (docs/OTA.md)"; exit 1; }
          npm run -s ota:upload -- --maps tools/tiles/out/release

      - name: Publish release
        # For app JS older than the Worker's maps (docs/UPDATES-SPEC.md §4).
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(jq -r .osm_date tools/tiles/out/release/index.json)
          tag="maps-$date"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" tools/tiles/out/release/* \
            --target "$GITHUB_SHA" --latest=false \
            --title "Offline maps $date" \
            --notes "Offline maps for Ukraine and each oblast, built by tools/tiles ($GITHUB_SHA). OSM data $date from Geofabrik. Catalog: index.json; one <region>.pmtiles per region (tools/tiles/regions/regions.json) plus shared style, sprites and fonts.

          Map data © OpenStreetMap contributors (ODbL). Tiles schema © OpenMapTiles."

      - name: Prune old releases
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName \
            --jq '.[].tagName | select(test("^maps-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' \
            | sort -r | tail -n +$((KEEP_RELEASES + 1)) | while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done
