name: Publish OTA Update

# JS-only changes of main reach installed Release builds without a new IPA/APK (docs/OTA.md). Called by ci.yml for
# the platforms that got no native build; can also be run by hand on main.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to publish for"
        type: choice
        options: ["ios android", ios, android]
        default: "ios android"
  workflow_call:
    inputs:
      platforms:
        type: string
        required: true
    secrets:
      # Declared for the linter: the job's ota environment (main only) holds them, and its values win over the caller's.
      OTA_SIGNING_KEY:
        required: false
      OTA_PUBLISH_TOKEN:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  publish:
    # Phones run main: a branch's JS never goes out (a branch gets an IPA/APK with [build]).
    if: ${{ github.ref == 'refs/heads/main' }}
    # Holds the signing key and the publish token; only main may use it (docs/OTA.md), so a workflow edited on a
    # branch never sees them.
    environment: ota
    # One publish at a time, in push order: the last one is what phones get.
    concurrency:
      group: publish-ota
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATFORMS: ${{ inputs.platforms }}
      OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check the secrets
        # main no longer builds an IPA/APK for JS-only changes: without these, they would reach no phone.
        run: |
          [ -n "$OTA_SIGNING_KEY" ] || { echo "::error::OTA_SIGNING_KEY is missing from the ota environment (docs/OTA.md)"; exit 1; }
          [ -n "$OTA_PUBLISH_TOKEN" ] || { echo "::error::OTA_PUBLISH_TOKEN is missing from the ota environment (docs/OTA.md)"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export the JS bundles
        env:
          # Inlined into the bundle: trip logs and Sentry say which commit the JS came from (ver_sw).
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npx expo export $(printf -- '--platform %s ' $PLATFORMS) --output-dir dist

      - name: Sign the updates
        run: npm run -s ota:prepare -- --dist dist --out ota-out

      - name: Publish
        # Refuses a runtime no build has: the update would reach no phone.
        run: npm run -s ota:publish -- --out ota-out --require-build

      - name: Tell Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="wtf.ai JS update (${PLATFORMS// /, }) · ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}
          $(git log -1 --format=%s)
          Restart the app twice: the first start downloads it, the next one runs it.
          ${RUN_URL}"
          curl -sS --fail-with-body -o /dev/null --data-urlencode chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$TEXT" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
