name: Build App Store iOS App

# The App Store build (docs/SPEC.md §2.2). ci.yml runs it for main's iOS native changes once the APPLE_TEAM_ID variable
# is set; it can also be run by hand. DISTRIBUTION=store (app.config.js): no AltStore, the
# Developer screen and the tester upload hidden until unlocked. Signed and uploaded to App Store Connect, where it goes
# to TestFlight and review, in one of two ways, chosen by which secrets exist:
# - key: the App Store Connect API key (Admin role). Xcode signs with cloud-managed certificates and profiles.
#   Secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text). Variable APPLE_TEAM_ID.
# - manual: an Apple Distribution certificate and an App Store provisioning profile made in the developer portal, and an
#   Apple ID with an app-specific password for the upload. For an account that cannot create API keys.
#   Secrets IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD, IOS_PROFILE_BASE64, ASC_APPLE_ID (the Apple ID's email),
#   ASC_APP_PASSWORD (app-specific). Variables APPLE_TEAM_ID, ASC_APP_ID (the app's Apple ID in App Store Connect).
# Without either, a run by hand builds the same app unsigned: a compile check of the store build. Run by ci.yml, it
# fails instead: an empty secret would otherwise go unnoticed.
# Run from main, a signed build registers its runtime with the update Worker (the register job), and the JS updates of
# main reach it from then on (publish-ota.yml, docs/OTA.md).
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      # Declared for the linter; ci.yml passes them all.
      SENTRY_AUTH_TOKEN:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_KEY_P8:
        required: false
      IOS_DIST_P12_BASE64:
        required: false
      IOS_DIST_P12_PASSWORD:
        required: false
      IOS_PROFILE_BASE64:
        required: false
      ASC_APPLE_ID:
        required: false
      ASC_APP_PASSWORD:
        required: false
      OTA_PUBLISH_TOKEN:
        required: false

env:
  DISTRIBUTION: store
  UPDATES_ORIGIN: ${{ vars.UPDATES_ORIGIN }}
  TRIP_UPLOAD_ORIGIN: ${{ vars.TRIP_UPLOAD_ORIGIN }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
  SENTRY_URL: ${{ vars.SENTRY_URL }}
  PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
  # 1 once Apple has added CarPlay navigation to the App ID and the profile has it (docs/CARPLAY-SPEC.md §2): the build
  # then claims the entitlement. Before that, claiming it fails the signing.
  CARPLAY_ENTITLEMENT: ${{ vars.CARPLAY_ENTITLEMENT }}

permissions:
  contents: read

jobs:
  build-ios-store:
    runs-on: macos-26
    timeout-minutes: 75
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      SIGNING: >-
        ${{ (secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && vars.APPLE_TEAM_ID != '') && 'key'
        || (secrets.IOS_DIST_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.ASC_APPLE_ID != ''
        && secrets.ASC_APP_PASSWORD != '' && vars.APPLE_TEAM_ID != '' && vars.ASC_APP_ID != '') && 'manual'
        || 'none' }}
    steps:
      - name: Check the signing secrets
        # Called by ci.yml (a push event), the build is meant for App Store Connect.
        if: ${{ github.event_name != 'workflow_dispatch' && env.SIGNING == 'none' }}
        run: |
          echo "::error::Neither the App Store Connect key nor the certificate secrets are complete: nothing to upload (see the top of build-ios-store.yml)"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Build number
        # The same CFBundleVersion scheme as the sideloaded build (docs/UPDATES-SPEC.md §3): it only grows.
        run: |
          BUILD=$(( ($(git log -1 --format=%ct) - 1577836800) / 60 ))
          VERSION=$(jq -r .expo.version app.json)
          SCHEME=$(basename "$(ls -d ios/*.xcworkspace | head -n 1)" .xcworkspace)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "ios/$SCHEME/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "ios/$SCHEME/Info.plist"
          {
            echo "SCHEME=$SCHEME"
            echo "BUILD=$BUILD"
            echo "VERSION=$VERSION"
            echo "BUNDLE_ID=$(jq -r .expo.ios.bundleIdentifier app.json)"
          } >> "$GITHUB_ENV"
          echo "Version $VERSION, build $BUILD, signing: $SIGNING"

      - name: Check the store Info.plist
        # App Review 5.1.1: every purpose string is ours, none a library default; the privacy manifest is there.
        run: |
          PLIST="ios/$SCHEME/Info.plist"
          /usr/libexec/PlistBuddy -c Print "$PLIST" | grep -E "UsageDescription|ExternalAccessory|UIBackgroundModes" -A6 || true
          if /usr/libexec/PlistBuddy -c Print "$PLIST" | grep -E 'UsageDescription = Allow \$\(PRODUCT_NAME\) to access'; then
            echo "::error::A library's generic purpose string is in the store build"; exit 1
          fi
          # NSLocalNetworkUsageDescription is expo-dev-launcher's: its build phase strips it from every non-Debug build.
          test -f "ios/$SCHEME/PrivacyInfo.xcprivacy" || { echo "::error::No PrivacyInfo.xcprivacy"; exit 1; }

      - name: App Store Connect key
        if: ${{ env.SIGNING == 'key' }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive and upload to App Store Connect
        if: ${{ env.SIGNING == 'key' }}
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" -authenticationKeyPath "$ASC_KEY_PATH")
          xcodebuild -workspace "ios/$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/wtfai.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/wtfai.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"

      - name: Install certificate and profile
        # A keychain of its own for the Apple Distribution certificate, and the profile where Xcode looks for it.
        if: ${{ env.SIGNING == 'manual' }}
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KEYCHAIN="$RUNNER_TEMP/signing/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/dist.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/app.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          security cms -D -i "$RUNNER_TEMP/signing/app.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/signing/profile.plist")
          PROFILE_APP_ID=$(plutil -extract Entitlements.application-identifier raw -o - "$RUNNER_TEMP/signing/profile.plist")
          if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::The profile is for $PROFILE_APP_ID, the app is $APPLE_TEAM_ID.$BUNDLE_ID"; exit 1
          fi
          if plutil -extract ProvisionedDevices raw -o - "$RUNNER_TEMP/signing/profile.plist" > /dev/null 2>&1; then
            echo "::error::The profile lists devices: an Ad Hoc or development profile, not App Store"; exit 1
          fi
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/signing/app.mobileprovision" "$DIR/$PROFILE_UUID.mobileprovision"
          done
          rm "$RUNNER_TEMP/signing/dist.p12"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Profile $PROFILE_UUID for $PROFILE_APP_ID, expires $(plutil -extract ExpirationDate raw -o - "$RUNNER_TEMP/signing/profile.plist")"

      - name: Manual signing on the app target
        # Only the app target: a profile set on the command line reaches the Pods targets too, and they refuse one.
        if: ${{ env.SIGNING == 'manual' }}
        run: |
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("ios/#{ENV["SCHEME"]}.xcodeproj")
            target = project.native_targets.find { |t| t.name == ENV["SCHEME"] } or abort "No target #{ENV["SCHEME"]}"
            target.build_configurations.each do |config|
              s = config.build_settings
              s.delete("PROVISIONING_PROFILE")
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = ENV["APPLE_TEAM_ID"]
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
            end
            project.save
          '

      - name: Archive and export with the certificate
        if: ${{ env.SIGNING == 'manual' }}
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          xcodebuild -workspace "ios/$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/wtfai.xcarchive" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/wtfai.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          codesign -d --entitlements :- "$(ls -d "$RUNNER_TEMP"/wtfai.xcarchive/Products/Applications/*.app)" || true
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect with an app-specific password
        if: ${{ env.SIGNING == 'manual' }}
        env:
          ASC_APPLE_ID: ${{ secrets.ASC_APPLE_ID }}
          ASC_APP_PASSWORD: ${{ secrets.ASC_APP_PASSWORD }}
        run: |
          xcrun altool --upload-package "$IPA" --type ios --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD" --bundle-short-version-string "$VERSION" \
            --username "$ASC_APPLE_ID" --password "@env:ASC_APP_PASSWORD" --output-format normal

      - name: Build unsigned (no signing secrets)
        if: ${{ env.SIGNING == 'none' }}
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          echo "::warning::Neither the App Store Connect key nor the certificate secrets: building unsigned, nothing uploaded"
          set -o pipefail
          xcodebuild -workspace "ios/$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: OTA runtime of the build
        # The fingerprint the uploaded build embedded (docs/OTA.md): the register job below makes the JS updates of main
        # go to it. Not for the unsigned compile check, which no phone runs.
        id: runtime
        if: ${{ env.SIGNING != 'none' }}
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/wtfai.xcarchive/Products/Applications/*.app | head -n 1)
          FINGERPRINT=$(find "$APP" -path '*EXUpdates.bundle*' -name fingerprint | head -n 1)
          if [ -n "$FINGERPRINT" ]; then
            echo "runtime=$(cat "$FINGERPRINT")" >> "$GITHUB_OUTPUT"
            echo "Runtime: $(cat "$FINGERPRINT")"
          else
            echo "::warning::No embedded fingerprint in the app: this build will take no JS updates"
          fi

      - name: Remove the key, certificate and profile
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          if [ -f "$RUNNER_TEMP/signing/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing/build.keychain-db" || true
          fi
          rm -rf "$RUNNER_TEMP/signing"
          [ -z "$PROFILE_UUID" ] || rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

  register:
    # The JS updates of main go to the runtimes registered with the update Worker (docs/OTA.md). A job of its own: the
    # token lives in the ota environment, which only main may use. A store build from a branch takes main's updates
    # only while its runtime is one main registered.
    needs: build-ios-store
    if: ${{ github.ref == 'refs/heads/main' && needs.build-ios-store.outputs.runtime != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ota
    env:
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
      RUNTIME: ${{ needs.build-ios-store.outputs.runtime }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Register the build
        # ota:publish needs no dependencies.
        run: |
          [ -n "$OTA_PUBLISH_TOKEN" ] || { echo "::error::OTA_PUBLISH_TOKEN is missing from the ota environment (docs/OTA.md)"; exit 1; }
          [ -n "$UPDATES_ORIGIN" ] || { echo "::error::The UPDATES_ORIGIN repository variable is not set (docs/OTA.md)"; exit 1; }
          npm run -s ota:publish -- --register-build --platform ios --runtime "$RUNTIME" --distribution store
