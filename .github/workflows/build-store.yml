name: Build Google Play bundle

# The Android App Bundle for Google Play (docs/SPEC.md §2.2). DISTRIBUTION=store (app.config.js): no
# REQUEST_INSTALL_PACKAGES, no in-app APK installer, the tester trip upload behind the Developer unlock. Signed with
# the android-release key, which Play App Signing takes as the upload key, and uploaded to the Play track PLAY_TRACK
# (variable, default internal) with the release status PLAY_RELEASE_STATUS (default completed). ci.yml runs it for
# main's Android native changes once PLAY_TRACK is set; it can also be run by hand. From a branch (no keystore) it is
# signed with the debug key, which Play refuses: a compile check, nothing uploaded. Never published to our update
# server's downloads, never announced: Play delivers it. Run from main, the uploaded build registers its runtime with
# the update Worker (the register job), and the JS updates of main reach it from then on (publish-ota.yml,
# docs/OTA.md). Secret: PLAY_SERVICE_ACCOUNT_JSON (android-release environment), the JSON key of a service account
# invited in Play Console with release rights for the app. The App Store build is build-ios-store.yml.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      # Declared for the linter: on main the jobs' android-release and ota environments hold them, and their values win.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      OTA_PUBLISH_TOKEN:
        required: false

env:
  DISTRIBUTION: store
  UPDATES_ORIGIN: ${{ vars.UPDATES_ORIGIN }}
  TRIP_UPLOAD_ORIGIN: ${{ vars.TRIP_UPLOAD_ORIGIN }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
  SENTRY_URL: ${{ vars.SENTRY_URL }}
  PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}

permissions:
  contents: read

jobs:
  build-aab:
    environment: ${{ github.ref == 'refs/heads/main' && 'android-release' || '' }}
    # One upload at a time: Play keeps one edit per app, and a second one opened meanwhile fails. A newer push waiting
    # replaces an older one still waiting.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'google-play' || format('google-play-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install dependencies
        run: npm ci

      - name: Runtime as an export sees it
        # publish-ota resolves the runtime from a fresh checkout, without prebuild; the build embeds this one. Left to
        # itself, expo-updates' Gradle task fingerprints the tree mid-build, while the four ABIs' native builds write
        # into node_modules: each bundle got another runtime (f1c6e11a, f4556504 for 07cd5b72), and no update reached it.
        run: |
          RUNTIME=$(npx expo-updates fingerprint:generate --platform android | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).hash)')
          [ -n "$RUNTIME" ] || { echo "::error::Could not resolve the runtime"; exit 1; }
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$RUNTIME" >> "$GITHUB_ENV"
          echo "Runtime: $RUNTIME"

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build number
        # The same versionCode scheme as the sideloaded APK (docs/UPDATES-SPEC.md §3), so Play always sees it grow.
        run: |
          BUILD=$(( ($(git log -1 --format=%ct) - 1577836800) / 60 ))
          sed -i -E "s/^(\s*)versionCode [0-9]+/\1versionCode $BUILD/" android/app/build.gradle
          grep -q "versionCode $BUILD" android/app/build.gradle
          echo "Version $(jq -r .expo.version app.json), build $BUILD"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 (only on main): signed with the debug key, Play will refuse it"
          fi

      - name: Build release bundle
        env:
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          # Play serves each phone its ABI: all four, so emulators and Chromebooks get the app too.
          cd android
          ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64,x86 --no-daemon

      - name: Check the embedded runtime
        # Unequal, the JS updates of main (publish-ota) never reach this build.
        run: |
          EMBEDDED=$(unzip -p android/app/build/outputs/bundle/release/app-release.aab base/assets/fingerprint 2>/dev/null || true)
          if [ "$EMBEDDED" != "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" ]; then
            echo "::error::The bundle embeds runtime '$EMBEDDED', publish-ota resolves $EXPO_UPDATES_FINGERPRINT_OVERRIDE"; exit 1
          fi

      - name: Check the store manifest
        # The policy-sensitive permissions, from the bundle Play will read.
        run: |
          MANIFEST=android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          [ -f "$MANIFEST" ] || MANIFEST=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          grep -o 'android.permission.[A-Z_]*' "$MANIFEST" | sort -u
          if grep -q REQUEST_INSTALL_PACKAGES "$MANIFEST"; then
            echo "::error::REQUEST_INSTALL_PACKAGES is in the store build"; exit 1
          fi
          for P in SYSTEM_ALERT_WINDOW ACTIVITY_RECOGNITION USE_BIOMETRIC USE_FINGERPRINT; do
            if grep -q "android:name=\"android.permission.$P\" />" "$MANIFEST"; then
              echo "::error::$P is in the store build: nothing uses it (app.config.js UNUSED)"; exit 1
            fi
          done

      - name: Upload to Google Play
        # main only: a branch's bundle has the debug key, which Play refuses.
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PATH" ] || { echo "::error::No ANDROID_KEYSTORE_BASE64 in the android-release environment: Play refuses the debug key"; exit 1; }
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is missing from the android-release environment (docs/CI.md)"; exit 1; }
          # play-upload needs no dependencies.
          npm run -s store:play -- --file android/app/build/outputs/bundle/release/app-release.aab \
            --track "$PLAY_TRACK" --status "$PLAY_RELEASE_STATUS"

      - name: OTA runtime of the build
        # The fingerprint the uploaded bundle embedded (docs/OTA.md): the register job below makes the JS updates of main
        # go to it. Only after an upload: a bundle no phone gets needs no updates.
        id: runtime
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          RUNTIME=$(unzip -p android/app/build/outputs/bundle/release/app-release.aab base/assets/fingerprint 2>/dev/null || true)
          if [ -n "$RUNTIME" ]; then
            echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
            echo "Runtime: $RUNTIME"
          else
            echo "::warning::No embedded fingerprint in the bundle: this build will take no JS updates"
          fi

  register:
    # The JS updates of main go to the runtimes registered with the update Worker (docs/OTA.md). A job of its own: the
    # token lives in the ota environment, which only main may use.
    needs: build-aab
    if: ${{ github.ref == 'refs/heads/main' && needs.build-aab.outputs.runtime != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ota
    env:
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
      RUNTIME: ${{ needs.build-aab.outputs.runtime }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Register the build
        # ota:publish needs no dependencies.
        run: |
          [ -n "$OTA_PUBLISH_TOKEN" ] || { echo "::error::OTA_PUBLISH_TOKEN is missing from the ota environment (docs/OTA.md)"; exit 1; }
          [ -n "$UPDATES_ORIGIN" ] || { echo "::error::The UPDATES_ORIGIN repository variable is not set (docs/OTA.md)"; exit 1; }
          npm run -s ota:publish -- --register-build --platform android --runtime "$RUNTIME" --distribution store
