name: CarPlay Simulator

# The car's screen in the iOS Simulator (docs/CARPLAY-SPEC.md §6.2): a Release build for the simulator that claims the
# CarPlay entitlement (CARPLAY_ENTITLEMENT=1; the simulator wants no profile for it), started on the phone, then the
# Simulator's CarPlay display turned on and the app opened there with a click on its icon
# (.github/scripts/carplay/). Passes when the app's CarPlay scene becomes active after the click with its map drawn by
# the React root (it connects in the background before, as soon as the display comes on). The artifact: screenshots
# of both displays and the desktop, the app's log, any crash report. No signing, no account.
on:
  workflow_dispatch:
  push:
    paths:
      - "modules/car-play/**"
      - "src/components/car-play/**"
      - ".github/workflows/carplay-simulator.yml"
      - ".github/scripts/carplay/**"

concurrency:
  group: carplay-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  carplay-simulator:
    # Expo SDK 57 requires Xcode 26.4+
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CARPLAY_ENTITLEMENT: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      OUT: ${{ github.workspace }}/carplay-simulator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore CocoaPods download cache
        # build-ios.yml's, saved by main.
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('package-lock.json', 'patches/**', 'modules/*/ios/*.podspec') }}
          restore-keys: ios-pods-

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Boot a simulator
        run: |
          mkdir -p "$OUT"
          UDID=$(xcrun simctl list devices available -j | node .github/scripts/carplay/pick-iphone.js)
          [ -n "$UDID" ] || { xcrun simctl list devices available; echo "::error::No iPhone simulator"; exit 1; }
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for the simulator
        # Signed to run locally, so the entitlements file is embedded; only the simulator's architecture.
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination "id=$UDID" -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- \
            build
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          {
            echo "APP=$APP"
            echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            echo "EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          } >> "$GITHUB_ENV"

      - name: Check the app claims the CarPlay entitlement
        # A simulator build keeps its entitlements in the executable's __entitlements section.
        run: |
          codesign -d --entitlements - "$APP" 2>/dev/null || true
          grep -aq "com.apple.developer.carplay-maps" "$APP/$EXECUTABLE" ||
            { echo "::error::com.apple.developer.carplay-maps is not in the app"; exit 1; }

      - name: Start the app on the phone
        # Location granted and set in Kyiv: the navigator refuses fixes outside Ukraine.
        run: |
          defaults write com.apple.iphonesimulator CarPlay -bool YES
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location "$BUNDLE_ID"
          xcrun simctl location "$UDID" set 50.4501,30.5234
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 20
          xcrun simctl io "$UDID" screenshot "$OUT/phone.png"

      - name: Turn on the CarPlay display
        run: |
          osascript .github/scripts/carplay/carplay-display.applescript
          sleep 15
          xcrun simctl io "$UDID" screenshot --display=external "$OUT/carplay-home.png"
          screencapture -x "$OUT/desktop.png" || true

      - name: Open the app on the CarPlay screen
        # "wtf" of its label "wtf.ai", whatever OCR makes of the dot.
        run: bash .github/scripts/carplay/open-app.sh "$UDID" wtf "$OUT"

      - name: Screenshots with the app on the CarPlay screen
        run: |
          sleep 10
          xcrun simctl io "$UDID" screenshot --display=external "$OUT/carplay-app.png"
          xcrun simctl io "$UDID" screenshot "$OUT/phone-after.png"

      - name: Collect logs
        if: ${{ !cancelled() && env.UDID != '' }}
        run: |
          xcrun simctl spawn "$UDID" log show --last 60m --style compact --info \
            --predicate 'subsystem == "ai.wtf.navigator"' > "$OUT/carplay.log" || true
          xcrun simctl spawn "$UDID" log show --last 60m --style compact \
            --predicate "process == \"${EXECUTABLE:-wtfai}\"" > "$OUT/app.log" || true
          cp ~/Library/Logs/DiagnosticReports/*"${EXECUTABLE:-wtfai}"* "$OUT/" 2>/dev/null || true
          grep "CarPlay" "$OUT/carplay.log" || echo "No CarPlay lines in the app's log"

      - name: Upload screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: carplay-simulator
          path: carplay-simulator/
          retention-days: 14
          if-no-files-found: ignore

      - name: Check the car's map is the React root
        run: |
          grep -q "CarPlay map: the React root" "$OUT/carplay.log" ||
            { echo "::error::The CarPlay map isn't the React root (carplay.log)"; exit 1; }
