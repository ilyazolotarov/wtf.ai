name: Build Unsigned iOS App

# Unsigned IPA for sideloading with AltStore (no paid Apple account, no EAS).
# Runs on demand, and from ci.yml when a commit needs a build (docs/CI.md).
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Release = standalone app (JS embedded). Debug = dev client, needs Metro on your LAN."
        type: choice
        options: [Release, Debug]
        default: Release
      notify:
        description: "Tell Telegram (a message with the run's link)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
      notify:
        # false for compile checks of branch pushes. main's Release builds are announced by ci.yml's publish-builds.
        type: boolean
        default: false
      retention-days:
        type: number
        default: 14
    outputs:
      runtime:
        # The OTA runtime of a Release build (docs/OTA.md), empty for Debug: ci.yml registers it on main.
        value: ${{ jobs.build-ios.outputs.runtime }}
      # What ci.yml's publish-builds needs to publish a Release build (docs/UPDATES-SPEC.md §3).
      build:
        value: ${{ jobs.build-ios.outputs.build }}
      version:
        value: ${{ jobs.build-ios.outputs.version }}
      permissions:
        value: ${{ jobs.build-ios.outputs.permissions }}
      min-os:
        value: ${{ jobs.build-ios.outputs.min-os }}
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

# This project's servers and Sentry account (app.config.js): repository variables, so the repo names none and a fork
# sets its own. Every job that builds, exports or publishes sees the same values: they are part of the OTA runtime
# version. Unset: that feature is off. SENTRY_URL (the Sentry region) is read by sentry-cli for the uploads.
env:
  UPDATES_ORIGIN: ${{ vars.UPDATES_ORIGIN }}
  TRIP_UPLOAD_ORIGIN: ${{ vars.TRIP_UPLOAD_ORIGIN }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_URL: ${{ vars.SENTRY_URL }}

jobs:
  build-ios:
    # Expo SDK 57 requires Xcode 26.4+
    runs-on: macos-26
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
      build: ${{ steps.build-number.outputs.build }}
      version: ${{ steps.build-number.outputs.version }}
      permissions: ${{ steps.permissions.outputs.permissions }}
      min-os: ${{ steps.permissions.outputs.min-os }}
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      # Source maps / dSYMs go to Sentry only when the SENTRY_AUTH_TOKEN secret (plus the SENTRY_URL, SENTRY_ORG and
      # SENTRY_PROJECT repo variables) are set; otherwise the Sentry build phases skip the upload.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
      # Optional: a message to a Telegram chat when both secrets are set (README).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Compiler cache for the C/C++/Objective-C of the pods (React Native core and Expo modules
      # come prebuilt; Swift is not cached). The Podfile turns it on with USE_CCACHE=1, which points
      # CC/CXX at React Native's ccache-clang(++).sh. Xcode runs compiles without the job's
      # environment or the CCACHE_BINARY build setting those wrappers expect, so "Install ccache"
      # writes the ccache path into the wrappers and the settings into their ccache.conf.
      USE_CCACHE: "1"
      CCACHE_CONFIGPATH: ${{ github.workspace }}/node_modules/react-native/scripts/xcode/ccache.conf
      # Caches are saved by main only and restored everywhere: branches start from main's,
      # and their own builds don't evict it.
      SAVE_CACHES: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Expo SDK 57 requires Node 22.13+
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ccache
        run: |
          command -v ccache || brew install ccache
          CCACHE_BIN=$(command -v ccache)
          WRAPPERS=node_modules/react-native/scripts/xcode
          sed -i '' "s|^exec \$CCACHE_BINARY |exec $CCACHE_BIN |" "$WRAPPERS/ccache-clang.sh" "$WRAPPERS/ccache-clang++.sh"
          grep -q "exec $CCACHE_BIN clang " "$WRAPPERS/ccache-clang.sh"
          grep -q "exec $CCACHE_BIN clang++ " "$WRAPPERS/ccache-clang++.sh"
          # Read by every compile through the wrappers and by the statistics step (CCACHE_CONFIGPATH above).
          {
            echo "cache_dir = $HOME/ccache"
            echo "max_size = 2G"
            echo "log_file = $RUNNER_TEMP/ccache.log"
          } >> "$CCACHE_CONFIGPATH"
          cat "$CCACHE_CONFIGPATH"

      - name: Restore CocoaPods download cache
        # Pod sources and the prebuilt React Native / Hermes tarballs.
        id: pods-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('package-lock.json', 'patches/**', 'modules/*/ios/*.podspec') }}
          restore-keys: ios-pods-

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/ccache
          key: ios-ccache-${{ inputs.configuration }}-${{ github.sha }}
          restore-keys: ios-ccache-${{ inputs.configuration }}-

      - name: Run Expo Prebuild
        # Prebuild runs `pod install` itself on macOS
        run: npx expo prebuild --platform ios --clean

      - name: Build number
        # The commit's time in minutes since 2020-01-01 UTC (docs/UPDATES-SPEC.md §3): it grows along main, so AltStore
        # and the app see a newer build. Set in the generated Info.plist, never in app.json: it must not change the
        # runtime version (ios/ is generated and not part of the fingerprint).
        id: build-number
        run: |
          BUILD=$(( ($(git log -1 --format=%ct) - 1577836800) / 60 ))
          VERSION=$(jq -r .expo.version app.json)
          SCHEME=$(basename "$(ls -d ios/*.xcworkspace | head -n 1)" .xcworkspace)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "ios/$SCHEME/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "ios/$SCHEME/Info.plist"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $BUILD"

      - name: Embed JS bundle in Debug builds
        # The prebuild template's "Bundle React Native code and images" phase does
        # `export SKIP_BUNDLING=1` for Debug (FORCE_BUNDLING can't override it; it only applies to
        # simulator builds). The phase then sources ios/.xcode.env.updates, the hook meant for
        # unsetting it. With main.jsbundle embedded and `embeddedBundle: true` on expo-dev-client
        # (app.json), patches/expo-dev-launcher+*.patch makes the app open it on launch instead of
        # showing the launcher. The tools button is off (app.json); shake the phone for the dev menu.
        if: ${{ inputs.configuration == 'Debug' }}
        run: echo "unset SKIP_BUNDLING" > ios/.xcode.env.updates

      - name: Build unsigned .app
        env:
          # Inlined into the JS bundle by Metro: trip logs say which commit they came from (ver_sw).
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build

      - name: Upload Debug dSYMs to Sentry
        # Sentry's build phase skips any configuration named Debug, and Debug makes no dSYMs by default: crashes and
        # hangs from Debug IPAs came with every frame of the app <redacted>.
        if: ${{ inputs.configuration == 'Debug' && env.SENTRY_DISABLE_AUTO_UPLOAD != 'true' }}
        continue-on-error: true
        run: npx sentry-cli debug-files upload build/Build/Products/Debug-iphoneos

      - name: ccache statistics
        if: ${{ !cancelled() }}
        run: |
          ccache --show-stats --verbose || true
          # Did the compiles go through ccache at all?
          echo "ccache log: $(grep -c 'Command line' "$RUNNER_TEMP/ccache.log" 2>/dev/null || true) invocations"
          grep -m 5 -E 'Result:|Failed|disabled' "$RUNNER_TEMP/ccache.log" 2>/dev/null || true

      - name: Save CocoaPods download cache
        if: ${{ env.SAVE_CACHES == 'true' && steps.pods-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Save ccache
        if: ${{ env.SAVE_CACHES == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Package into IPA
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "wtfai-${CONFIGURATION}-unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          # Upload the .ipa as-is (no zip wrapper); artifact is named after the file
          archive: false
          path: wtfai-${{ inputs.configuration }}-unsigned.ipa
          retention-days: ${{ inputs.retention-days || 14 }}

      - name: Permissions for AltStore
        # AltStore refuses an IPA whose entitlements and usage descriptions differ from its source's appPermissions
        # (docs/UPDATES-SPEC.md §3): read them from the app just built. Unsigned, it has no entitlements. Release only:
        # only main's Release builds are published.
        id: permissions
        if: ${{ inputs.configuration == 'Release' }}
        # A failure here stops only the publish of this IPA (publish-builds checks for the output), not the build.
        continue-on-error: true
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -n 1)
          PRIVACY=$(plutil -convert json -o - "$APP/Info.plist" | jq -c 'with_entries(select(.key | endswith("UsageDescription")))')
          ENTITLEMENTS='[]'
          for BIN in "$APP" "$APP"/PlugIns/*.appex; do
            [ -e "$BIN" ] || continue
            FOUND=$( (codesign -d --entitlements :- "$BIN" 2>/dev/null | plutil -convert json -o - - 2>/dev/null | jq -c 'keys') || true)
            [ -n "$FOUND" ] && ENTITLEMENTS=$(jq -cn --argjson a "$ENTITLEMENTS" --argjson b "$FOUND" '$a + $b | unique')
          done
          PERMISSIONS=$(jq -cn --argjson e "$ENTITLEMENTS" --argjson p "$PRIVACY" '{entitlements: ($e - ["application-identifier", "com.apple.developer.team-identifier"]), privacy: $p}')
          echo "permissions=$PERMISSIONS" >> "$GITHUB_OUTPUT"
          echo "min-os=$(plutil -extract MinimumOSVersion raw -o - "$APP/Info.plist")" >> "$GITHUB_OUTPUT"
          echo "$PERMISSIONS"

      - name: Tell Telegram
        # A message, never the file (docs/UPDATES-SPEC.md §3): the run's artifacts hold it. main's Release builds are
        # announced by ci.yml's publish-builds, with the download links, once they are published.
        if: ${{ inputs.notify && !(github.ref == 'refs/heads/main' && inputs.configuration == 'Release') && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="wtf.ai iOS ${CONFIGURATION} · ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}
          $(git log -1 --format=%s)
          IPA: ${RUN_URL}"
          curl -sS --fail-with-body -o /dev/null --data-urlencode chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$TEXT" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: OTA runtime of the build
        # The fingerprint the build embedded, so the update Worker and the app cannot disagree (docs/OTA.md). Release
        # only: a Debug build runs its own JS. ci.yml registers it, in the ota environment that holds the token.
        id: runtime
        if: ${{ inputs.configuration == 'Release' }}
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -n 1)
          FINGERPRINT=$(find "$APP" -path '*EXUpdates.bundle*' -name fingerprint | head -n 1)
          if [ -n "$FINGERPRINT" ]; then
            echo "runtime=$(cat "$FINGERPRINT")" >> "$GITHUB_OUTPUT"
            echo "Runtime: $(cat "$FINGERPRINT")"
          else
            echo "::warning::No embedded fingerprint in the app: JS updates will not be published for this build"
          fi
