name: Build Unsigned iOS App

# Unsigned IPA for sideloading with AltStore (no paid Apple account, no EAS).
# Runs on demand, and from ci.yml after the checks pass on every commit.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Release = standalone app (JS embedded). Debug = dev client, needs Metro on your LAN."
        type: choice
        options: [Release, Debug]
        default: Release
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Release
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

jobs:
  build-ios:
    # Expo SDK 57 requires Xcode 26.4+
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      # Source maps / dSYMs go to Sentry only when the SENTRY_AUTH_TOKEN secret (plus SENTRY_ORG and
      # SENTRY_PROJECT repo variables) are set; otherwise the Sentry build phases skip the upload.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Expo SDK 57 requires Node 22.13+
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        # Prebuild runs `pod install` itself on macOS
        run: npx expo prebuild --platform ios --clean

      - name: Embed JS bundle in Debug builds
        # The prebuild template's "Bundle React Native code and images" phase does
        # `export SKIP_BUNDLING=1` for Debug (FORCE_BUNDLING can't override it; it only applies to
        # simulator builds). The phase then sources ios/.xcode.env.updates, the hook meant for
        # unsetting it. With main.jsbundle embedded and `embeddedBundle: true` on expo-dev-client
        # (app.json), the dev launcher shows "Load embedded bundle" next to the Metro servers.
        if: ${{ inputs.configuration == 'Debug' }}
        run: echo "unset SKIP_BUNDLING" > ios/.xcode.env.updates

      - name: Build unsigned .app
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into IPA
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "wtfai-${CONFIGURATION}-unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          # Upload the .ipa as-is (no zip wrapper); artifact is named after the file
          archive: false
          path: wtfai-${{ inputs.configuration }}-unsigned.ipa
          retention-days: 14
