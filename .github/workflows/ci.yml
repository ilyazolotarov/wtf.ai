name: CI

# Lint, typecheck, unit tests (TS, Swift logic, Python), expo-doctor and the unsigned iOS build,
# each only when what it covers changed (docs/CI.md). No EAS: the unsigned IPA is sideloaded with
# AltStore (docs/SPEC.md §2).
#
# - Branch pushes: checks for what changed; a native change is also compiled (CI is the only
#   Xcode). `[build]`, `[build ios]` or `[build android]` in a commit message also builds and
#   sends the result to Telegram.
# - Pushes to main: checks; app code changes go to Telegram: a Release build after a native change, else an OTA JS
#   update for the installed builds (docs/OTA.md).
# - Pull requests: from forks only (branches of this repo are covered by their pushes).
# - Manual run (Actions → CI → Run workflow): all checks, builds as chosen.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "iOS build. Debug = dev client with the JS bundle embedded; Release = standalone."
        type: choice
        options: [Debug, Release, none]
        default: Debug
      android:
        description: "Android build. tester = APK for testers; ci = the same build, named for CI."
        type: choice
        options: [none, tester, ci]
        default: none

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Newer pushes to a branch replace older runs; main finishes every run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read # ci-plan.sh looks up the last green run

jobs:
  plan:
    # Pull requests from branches of this repo already ran on push.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      python: ${{ steps.plan.outputs.python }}
      swift: ${{ steps.plan.outputs.swift }}
      kotlin: ${{ steps.plan.outputs.kotlin }}
      build_ios: ${{ steps.plan.outputs.build_ios }}
      build_android: ${{ steps.plan.outputs.build_android }}
      ota: ${{ steps.plan.outputs.ota }}
      notify: ${{ steps.plan.outputs.notify }}
      retention: ${{ steps.plan.outputs.retention }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the plan script
        run: .github/scripts/ci-plan.sh --test

      - name: Decide which jobs run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_IOS: ${{ inputs.ios }}
          DISPATCH_ANDROID: ${{ inputs.android }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-plan.sh

  checks:
    needs: plan
    if: ${{ needs.plan.outputs.checks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Expo type declarations
        # expo-env.d.ts is gitignored and normally written by `expo start`.
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci

      - name: Expo doctor
        run: npx expo-doctor

  python:
    needs: plan
    if: ${{ needs.plan.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            tools/triplog/pyproject.toml
            tools/tiles/pyproject.toml

      - name: Python tests (tools/triplog)
        run: |
          pip install -e "tools/triplog[dev]"
          python -m pytest tools/triplog

      - name: Python tests (tools/tiles)
        run: |
          pip install -e "tools/tiles[dev]"
          python -m pytest tools/tiles

  native-logic:
    # Swift unit tests for the Foundation-only logic of the local Expo modules (Package.swift, native-tests/).
    needs: plan
    if: ${{ needs.plan.outputs.swift == 'true' }}
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Swift tests
        run: swift test

  native-logic-android:
    # Kotlin unit tests for the Android-free logic of the local Expo modules (native-tests-android/), plain JVM.
    needs: plan
    if: ${{ needs.plan.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Kotlin tests
        working-directory: native-tests-android
        run: gradle test --console=plain

  build-ios:
    needs: [plan, checks, native-logic]
    # Skipped native-logic is fine; failed or cancelled is not.
    if: ${{ !cancelled() && needs.plan.outputs.build_ios != '' && needs.checks.result == 'success' && needs.native-logic.result != 'failure' }}
    uses: ./.github/workflows/build-ios.yml
    with:
      configuration: ${{ needs.plan.outputs.build_ios }}
      notify: ${{ needs.plan.outputs.notify == 'true' }}
      retention-days: ${{ fromJSON(needs.plan.outputs.retention) }}
    secrets: inherit

  build-android:
    # Signed release APK (docs/ANDROID-SPEC.md §4).
    needs: [plan, checks, native-logic-android]
    # Skipped native-logic-android is fine; failed or cancelled is not.
    if: ${{ !cancelled() && needs.plan.outputs.build_android != '' && needs.checks.result == 'success' && needs.native-logic-android.result != 'failure' }}
    uses: ./.github/workflows/build-android.yml
    with:
      variant: ${{ needs.plan.outputs.build_android }}
      notify: ${{ needs.plan.outputs.notify == 'true' }}
      retention-days: ${{ fromJSON(needs.plan.outputs.retention) }}
    secrets: inherit

  publish-ota:
    # JS-only changes of main, for the platforms that got no native build (docs/OTA.md).
    needs: [plan, checks]
    if: ${{ !cancelled() && needs.plan.outputs.ota != '' && needs.checks.result == 'success' }}
    uses: ./.github/workflows/publish-ota.yml
    with:
      platforms: ${{ needs.plan.outputs.ota }}
    secrets: inherit

  register-ota-runtime:
    # main's builds take the JS updates after them (docs/OTA.md): tell the update Worker their runtime. A job of its
    # own because the token lives in the ota environment, which only main may use; the builds also run on branches.
    needs: [build-ios, build-android]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.build-ios.outputs.runtime != '' || needs.build-android.outputs.runtime != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ota
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Register
        # ota:publish needs no dependencies for this.
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
          IOS_RUNTIME: ${{ needs.build-ios.outputs.runtime }}
          ANDROID_RUNTIME: ${{ needs.build-android.outputs.runtime }}
        run: |
          [ -n "$OTA_PUBLISH_TOKEN" ] || { echo "::error::OTA_PUBLISH_TOKEN is missing from the ota environment (docs/OTA.md)"; exit 1; }
          if [ -n "$IOS_RUNTIME" ]; then npm run -s ota:publish -- --register-build --platform ios --runtime "$IOS_RUNTIME"; fi
          if [ -n "$ANDROID_RUNTIME" ]; then npm run -s ota:publish -- --register-build --platform android --runtime "$ANDROID_RUNTIME"; fi
